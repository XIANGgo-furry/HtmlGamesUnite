<style>
#wrap{position:fixed;inset:0;background:#08080b;color:#fff;display:flex;flex-direction:column;gap:6px;
padding:calc(58px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
#top{flex:0 0 auto;text-align:center}
#foeart{width:74px;height:60px;margin:0 auto;border:3px solid #fff;border-radius:16px;background:#e8e8ee;
position:relative;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1}
#foeart.skull{background:#d9dde6;border-radius:50% 50% 12px 12px;box-shadow:inset 0 -8px 0 #aeb5c2}
#foeart.flower{background:#1b2a16;border-color:#8fd06a;border-radius:50%}
#foeart.armor{background:#3a4a63;border-color:#9fc4ff}
#foeart.web{background:#241a2e;border-color:#c58fff;border-radius:50%}

#foeart.forge{background:#3a1c10;border-color:#ff9a3c;border-radius:8px}
#foeart.card{background:#101c2c;border-color:#ffe27a;border-radius:6px}
#foeart.ice{background:#0e2434;border-color:#9fe8ff;border-radius:50%}
#foeart.void{background:#111;border-color:#b06bff;box-shadow:0 0 16px #6b2fd6 inset}
#foeart.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-5deg);filter:brightness(2)}75%{transform:translateX(8px) rotate(5deg);filter:brightness(2)}}
#foeline{font:13px/1.6 ui-monospace,monospace;display:flex;justify-content:center;gap:12px;align-items:center;margin-top:3px}
#foename.ok{color:#ffd54a}
#foehpwrap{display:inline-flex;align-items:center;gap:4px;color:#c9c9d2}
#foehptrack{width:70px;height:8px;border:1px solid #fff;background:#222;display:inline-block}
#foehpbar{display:block;height:100%;background:#7dff8a;width:100%;transition:width .2s}
#talk{flex:0 0 auto;min-height:62px;max-height:84px;overflow:hidden;border:2px solid #fff;border-radius:6px;
background:#000;padding:9px 11px;font:14px/1.5 ui-monospace,monospace;white-space:pre-wrap}
#board{position:relative;flex:1 1 auto;min-height:120px;border:3px solid #fff;border-radius:4px;background:#050507;overflow:hidden;touch-action:none}
#layer{position:absolute;inset:0;pointer-events:none}
#soul{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;line-height:1;
color:#ff2f4f;text-shadow:0 0 9px #ff2f4f;pointer-events:none;z-index:3}
#soul.blue{color:#4aa8ff;text-shadow:0 0 9px #4aa8ff}
#soul.orange{color:#ffb03a;text-shadow:0 0 9px #ffb03a}
#soul.hit{opacity:.25}
.hz{position:absolute;background:#f2f2f6;border:2px solid #fff;border-radius:4px;pointer-events:none;z-index:2}
.hz.bone{background:linear-gradient(180deg,#fff,#c9c9d6)}
.hz.bluebone{background:linear-gradient(180deg,#7cc4ff,#2b6fb8);border-color:#9fd4ff}
.hz.star{background:none;border:0;font:18px/1 ui-monospace,monospace;color:#fff;border-radius:0;width:auto!important;height:auto!important}
.hz.star.b{color:#4aa8ff}.hz.star.g{color:#8fd06a}.hz.star.o{color:#ff9a3c}.hz.star.v{color:#c58fff}
.hz.warn{background:rgba(255,60,60,.16);border:2px dashed #ff5b5b}
.hz.warn:after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font:700 18px ui-monospace,monospace;color:#ff8a8a}
.hz.fire{background:linear-gradient(90deg,rgba(255,255,255,.25),#fff,rgba(255,255,255,.25));
border:0;box-shadow:0 0 18px #fff,0 0 34px #9fd4ff}
.hz.zone{background:rgba(150,110,255,.13);border:2px dashed #a98cff;border-radius:10px}
.hz.zone:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(169,140,255,.25) 7px 9px)}
.hz.web{background:rgba(200,150,255,.1);border:2px dashed #c58fff;border-radius:8px}
.hz.lava{background:linear-gradient(180deg,rgba(255,120,30,.15),#ff6a1e);border:2px solid #ffb03a;box-shadow:0 0 20px #ff6a1e}
.hz.ice{background:linear-gradient(180deg,#eaffff,#69b9dd);border-color:#fff}
.hz.note{background:#ff7bd5;border-color:#fff;border-radius:50%}
.hz.card{background:linear-gradient(135deg,#fff6d8,#ffe27a);border-color:#fff;color:#7a5b00;
font:700 15px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;border-radius:5px}
.hz.spear{background:linear-gradient(90deg,#8fa8c8,#fff,#8fa8c8);border-color:#cfe0ff}
.hz.shield{background:rgba(120,170,255,.35);border:3px solid #9fc4ff}
.hz.ring{background:none;border:3px solid #ff7bd5;border-radius:50%;box-shadow:0 0 14px #ff7bd5}
.hz.spot{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.3);border-radius:50%}
#flash{position:absolute;inset:0;background:#f33;opacity:0;pointer-events:none;z-index:4;transition:opacity .12s}
#atk{position:absolute;left:8px;top:5px;font:11px/1.35 ui-monospace,monospace;color:#ffd54a;pointer-events:none;z-index:4;max-width:58%;white-space:pre-wrap}
#atk.hot{color:#ff6b6b;text-shadow:0 0 8px #ff6b6b}
#hint{position:absolute;right:8px;top:5px;font:11px/1.3 ui-monospace,monospace;color:#8b90a0;text-align:right;pointer-events:none;z-index:4}
#grav{position:absolute;right:8px;bottom:8px;z-index:5;min-width:52px;min-height:52px;border:2px solid #4aa8ff;
border-radius:10px;background:rgba(20,40,70,.85);color:#cfe8ff;font:700 13px ui-monospace,monospace;padding:4px}
#grav:active{background:#4aa8ff;color:#000}
#grav[hidden]{display:none}
.float{position:absolute;transform:translate(-50%,-50%);font:700 20px ui-monospace,monospace;color:#ffd54a;
text-shadow:0 0 6px #000;pointer-events:none;z-index:6;animation:fl .78s ease-out forwards}
.float.heal{color:#7dff8a}.float.hurt{color:#ff5b6e}.float.kr{color:#ff9c4a;font-size:15px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
#hud{flex:0 0 auto;font:12px/1.4 ui-monospace,monospace;color:#aeb4bd;display:flex;align-items:center;gap:8px}
#hudtxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hpwrap{flex:0 0 70px;height:9px;border:1px solid #fff;background:#222}
#hpbar{display:block;height:100%;background:#ff2f4f;width:100%;transition:width .2s}
#menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:0 0 auto}
#sub{display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto}
#sub:empty{display:none}
button{min-width:44px;min-height:48px;border:2px solid #fff;border-radius:8px;background:#12141b;color:#fff;
font-size:15px;font-weight:600;padding:6px 4px}
button:active{background:#fff;color:#000}
#timing{flex:1 1 100%;height:44px;position:relative;border:2px solid #fff;background:#12141b;overflow:hidden;border-radius:6px}
#ttarget{position:absolute;top:0;bottom:0;left:46%;width:8%;background:rgba(255,255,255,.18);border-left:2px solid #fff;border-right:2px solid #fff}
#tbar{position:absolute;top:0;bottom:0;left:0;width:4px;background:#ffd54a}
#tlabel{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:11px ui-monospace,monospace;color:#aeb4bd;pointer-events:none}
#select{position:fixed;inset:0;z-index:50;background:#08080b;overflow-y:auto;
padding:calc(64px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
#select h1{font-size:19px;text-align:center;margin:0 0 4px;letter-spacing:2px}
#select>p{text-align:center;color:#8b90a0;font:12px/1.5 ui-monospace,monospace;margin:0 0 10px}
.grp{max-width:440px;margin:14px auto 8px;font:700 13px ui-monospace,monospace;color:#7f8794;border-bottom:1px solid #333;padding-bottom:4px}
.card{display:block;width:100%;max-width:440px;margin:0 auto 9px;min-height:78px;text-align:left;
border:2px solid #fff;border-radius:12px;background:#12141b;color:#fff;padding:9px 12px}
.card:active{background:#fff;color:#000}
.card .n{font-size:16px;font-weight:700;display:block;margin-bottom:2px}
.card .d{font:11px/1.5 ui-monospace,monospace;color:#9ba1ad;display:block;white-space:normal}
.card .d b{color:#ffd54a}
.card:active .d,.card:active .d b{color:#333}
.card.hot{border-color:#7cc4ff;background:#101a2a}
.card.boss{border-color:#b06bff;background:#160f24}
</style>

<script>
/* 游戏逻辑写这里；纯前端，无网络请求 */
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var board=$('#board'),layer=$('#layer'),soul=$('#soul'),talk=$('#talk'),sub=$('#sub'),menu=$('#menu'),
    flash=$('#flash'),foe=$('#foeart'),sel=$('#select'),gravBtn=$('#grav'),atkEl=$('#atk');
var W=0,H=0,sx=0,sy=0,mouseIn=false,lastMove=0;
function size(){var r=board.getBoundingClientRect();W=r.width;H=r.height;if(!sx){sx=W/2;sy=H/2}place()}
function place(){soul.style.left=sx+'px';soul.style.top=sy+'px'}
function moveTo(x,y){var nx=Math.max(14,Math.min(W-14,x)),ny=Math.max(14,Math.min(H-14,y));
 if(nx!==sx||ny!==sy)lastMove=performance.now();sx=nx;sy=ny;place()}
function toClient(e){var r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function slowK(){var k=1;for(var i=0;i<hz.length;i++){var o=hz[i];if(o.slow&&sx>o.x&&sx<o.x+o.w&&sy>o.y&&sy<o.y+o.h)k=.42}return k}
function nudge(dx,dy){var k=slowK();moveTo(sx+dx*k,sy+dy*k)}

/* 触屏：相对位移，按哪都不瞬移；鼠标：直接跟手 */
var drag=false,pid=null,lx=0,ly=0;
board.addEventListener('pointerdown',function(e){
 if(S.phase!=='dodge'||e.target.closest('#grav'))return;
 if(e.pointerType==='mouse'){mouseIn=true;var p=toClient(e);nudge(p.x-sx,p.y-sy);return}
 drag=true;pid=e.pointerId;lx=e.clientX;ly=e.clientY;
 try{board.setPointerCapture(e.pointerId)}catch(err){}
});
board.addEventListener('pointermove',function(e){
 if(S.phase!=='dodge')return;
 if(e.pointerType==='mouse'){if(e.target.closest('#grav'))return;
  mouseIn=true;var p=toClient(e);nudge(p.x-sx,p.y-sy);return}
 if(!drag||e.pointerId!==pid)return;
 e.preventDefault();nudge(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;
});
board.addEventListener('pointerup',function(e){if(e.pointerId===pid){drag=false;pid=null}});
board.addEventListener('pointercancel',function(e){if(e.pointerId===pid){drag=false;pid=null}});
board.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')mouseIn=false});
function stopDrag(){drag=false;pid=null;mouseIn=false}

/* ---------- 弹幕原语库 ---------- */
var hz=[],raf=0,last=0,dodgeEnd=0,nextWave=0,waveN=0,invulUntil=0;
function haz(x,y,w,h,vx,vy,o){
 o=o||{};var d=document.createElement('div');
 d.className='hz '+(o.cls||'bone')+(o.warn?' warn':'');
 d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';d.style.height=h+'px';
 if(o.text)d.textContent=o.text;
 layer.appendChild(d);
 var obj={x:x,y:y,w:w,h:h,vx:vx||0,vy:vy||0,el:d,born:performance.now(),
  warn:o.warn||0,ttl:o.ttl||2400,fired:false,dmg:o.dmg||4,type:o.type||'rect',
  cls:o.cls||'bone',slow:!!o.slow,homing:o.homing||0,cx:o.cx||0,cy:o.cy||0,
  ang:o.ang||0,rad:o.rad||0,spin:o.spin||0,grav:o.grav||0,pulse:o.pulse||0};
 hz.push(obj);return obj;
}
function star(x,y,vx,vy,c){return haz(x,y,0,0,vx,vy,{cls:'star'+(c?' '+c:''),text:'✦',ttl:2800,type:'star'})}
function zone(x,y,w,h,ttl){return haz(x,y,w,h,0,0,{cls:'web',ttl:ttl||2600,type:'zone',slow:true,dmg:0})}
function atk(t,hot){atkEl.textContent=t;atkEl.className=hot?'hot':''}
function clearH(){hz.forEach(function(o){o.el.remove()});hz=[];stopT();stopDrag();
 if(raf){cancelAnimationFrame(raf);raf=0}last=0}
function setGrav(g){S.grav=g;gravBtn.innerHTML='重力<br>'+(g>0?'↓':'↑');soul.classList.add('blue')}

/* 33 套招式生成器：每只角色从中挑 4~6 套轮转 */
var V=function(){return 2+S.turn*.07};
var WAVES={
 boneTop:function(){var g=Math.floor(Math.random()*5),i,v=V();for(i=0;i<6;i++)if(i!==g)star(W*(i+.5)/6,-18,0,v)},
 boneBottom:function(){var g=Math.floor(Math.random()*5),i,v=V();for(i=0;i<6;i++)if(i!==g)star(W*(i+.5)/6,H+18,0,-v,'b')},
 boneSide:function(){var i,v=V();for(i=0;i<4;i++)star(-18,H*(i+.5)/4,v+.2,0)},
 boneCorner:function(){star(-18,-18,1.5,1.5);star(W+18,-18,-1.5,1.5);star(-18,H+18,1.5,-1.5,'b');star(W+18,H+18,-1.5,-1.5,'b')},
 blueWall:function(){var g,i,v=V();setGrav(waveN%10===1?1:-1);
  g=Math.floor(Math.random()*5);for(i=0;i<6;i++)if(i!==g)haz(W*i/6,-16,W/6+2,18,0,v,{cls:'bluebone',ttl:2200});
  g=Math.floor(Math.random()*5);for(i=0;i<6;i++)if(i!==g)haz(W*i/6,H-2,W/6+2,18,0,-v,{cls:'bluebone',ttl:2200})},
 gbLaser:function(){var i,yy;for(i=0;i<2;i++){yy=H*(i+.6)/2.6-14;
  haz(-10,yy,W+20,28,0,0,{cls:'gb',warn:420+i*260,ttl:300,type:'beam',dmg:5})}
  if(waveN%2===0)haz(W*.62,-10,30,H+20,0,0,{cls:'gb',warn:760,ttl:300,type:'beam',dmg:5})},
 menuBone:function(){var g=Math.random()*(W-90),v=V();
  haz(0,-18,g,18,0,v+1,{ttl:1800});haz(g+76,-18,W-g-76,18,0,v+1,{ttl:1800});haz(0,H,H*.36,16,v+1,0,{ttl:1600})},
 floorPillar:function(){var g=Math.floor(Math.random()*5),i,v=V();
  for(i=0;i<5;i++)if(i!==g)haz(W*(i+.5)/5-10,H,20,86,0,-2.3,{ttl:1800});
  for(i=0;i<4;i++)star(-18,H*(i+.5)/4,v,0,'b')},
 volley:function(){haz(0,-10,W,16,0,0,{cls:'gb',warn:900,ttl:260,type:'beam',dmg:5});
  haz(0,H-6,W,16,0,0,{cls:'gb',warn:1300,ttl:260,type:'beam',dmg:5});
  haz(-10,0,16,H,0,0,{cls:'gb',warn:1700,ttl:260,type:'beam',dmg:5});
  haz(W-6,0,16,H,0,0,{cls:'gb',warn:1700,ttl:260,type:'beam',dmg:5})},
 petalRing:function(){var i;for(i=0;i<10;i++){var a=i*.628;star(W/2,H/2,Math.cos(a)*1.6,Math.sin(a)*1.6,i%2?'g':'')}},
 vineClose:function(){haz(-20,0,34,H,1.1,0,{cls:'lava',ttl:2400,dmg:3});
  haz(W-14,0,34,H,-1.1,0,{cls:'lava',ttl:2400,dmg:3});
  for(var i=0;i<5;i++)star(W/2,-18,Math.sin(i)*.9,2,'g')},
 spearThrust:function(){var g=Math.floor(Math.random()*4),i;
  for(i=0;i<4;i++)if(i!==g)haz(-20,H*(i+.5)/4-5,W+40,10,5.2,0,{cls:'spear',ttl:1500,dmg:5})},
 shieldWall:function(){var y=H*.3;haz(0,y,W*.42,H*.16,0,0,{cls:'shield',ttl:2200,dmg:4});
  haz(W*.58,y+H*.2,W*.42,H*.16,0,0,{cls:'shield',ttl:2200,dmg:4});
  for(var i=0;i<4;i++)star(W*(i+.5)/4,-18,0,2.4,'b')},
 orangeRush:function(){soul.classList.add('orange');S.orange=true;lastMove=performance.now();
  for(var i=0;i<5;i++)star(-18,H*(i+.5)/5,2.6+S.turn*.06,0,'o');
  haz(W*.3,-18,W*.4,14,0,1.9,{cls:'lava',ttl:2000,dmg:3})},
 hexStar:function(){var i;for(i=0;i<12;i++){var a=i*.524;
  haz(W/2+Math.cos(a)*90,H/2+Math.sin(a)*70,0,0,0,0,{cls:'star',text:'✧',type:'star',ttl:2100});
  var o=hz[hz.length-1];o.vx=-Math.cos(a)*1.5;o.vy=-Math.sin(a)*1.2}},
 webSlow:function(){zone(W*.12,H*.18,W*.46,H*.5,3000);zone(W*.58,H*.42,W*.32,H*.4,3000);
  for(var i=0;i<4;i++)star(-18,H*(i+.5)/4,1.5,0,'v')},
 diamondClose:function(){var i;for(i=0;i<10;i++){var a=i*.628;
  var o=star(W/2+Math.cos(a)*150,H/2+Math.sin(a)*120,-Math.cos(a)*1.7,-Math.sin(a)*1.4,'v');
  o.ttl=2200}},
 beatNote:function(){var i;for(i=0;i<5;i++)haz(-24,H*(i+.5)/5-9,20,20,2.9,0,{cls:'note',ttl:1900,dmg:3});
  for(i=0;i<3;i++)star(W*(i+.5)/3,-18,0,2.1,'')},
 spotlight:function(){var i;
  haz(-10,-10,W+20,H+20,0,0,{cls:'spot',ttl:2300,dmg:4,type:'outside'});
  for(i=0;i<4;i++)haz(Math.random()*(W-76),Math.random()*(H-76),76,76,0,0,
   {cls:'spot',ttl:2300,dmg:0,type:'safe'});
  for(i=0;i<3;i++)star(-18,H*(i+.5)/3,1.7,0,'')},
 soundRing:function(){var i;for(i=0;i<14;i++){var a=i*.449;
  star(W/2+Math.cos(a)*22,H/2+Math.sin(a)*22,Math.cos(a)*2.5,Math.sin(a)*2.5,'')}},
 fireWall:function(){haz(-20,H-44,W+40,30,0,-1.5,{cls:'lava',ttl:2200,dmg:5});
  haz(-20,-30,W+40,22,0,1.7,{cls:'lava',ttl:2200,dmg:4});
  for(var i=0;i<4;i++)star(W*(i+.5)/4,-18,0,2.2,'o')},
 hammerDrop:function(){var i,x;for(i=0;i<3;i++){x=W*(i+1)/4-24;
  haz(x,0,48,70,0,0,{cls:'warn',warn:300+i*300,ttl:220,type:'hammer',dmg:6})}

   (S.best[f.key]?'<br>最佳 '+S.best[f.key]+' 回合':'')+'</span></button>';
 });
 $('#cards').innerHTML=html;
})();
sel.addEventListener('click',function(e){var b=e.target.closest('button[data-foe]');if(!b)return;start(b.dataset.foe)});

window.addEventListener('resize',size);
size();showSelect();
})();
