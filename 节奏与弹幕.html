<title>节奏与弹幕</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<style>
#hub,#a,#b{position:fixed;inset:0;overflow-y:auto;background:#08080b;color:#fff;
padding:calc(62px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
#a,#b{display:none;overflow:hidden;flex-direction:column;gap:6px;padding-left:8px;padding-right:8px}
#hub h1{font-size:20px;text-align:center;margin:0 0 4px;letter-spacing:2px}
#hub>p{text-align:center;color:#8b90a0;font:12px/1.6 ui-monospace,monospace;margin:0 0 16px}
.hcard{display:block;width:100%;max-width:440px;margin:0 auto 12px;min-height:104px;text-align:left;
border:2px solid #fff;border-radius:14px;background:#12141b;color:#fff;padding:12px 14px}
.hcard:active{background:#fff;color:#000}
.hcard .n{font-size:18px;font-weight:700;display:block;margin-bottom:4px}
.hcard .d{font:12px/1.6 ui-monospace,monospace;color:#9ba1ad;display:block;white-space:normal}
.hcard:active .d{color:#333}
.hcard.one{border-color:#ff5b9e;background:#1b1020}
.hcard.two{border-color:#7cc4ff;background:#101a2a}
.tag{display:inline-block;font:11px ui-monospace,monospace;color:#08080b;background:#ffd54a;
border-radius:4px;padding:1px 6px;margin-bottom:6px}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;font:13px ui-monospace,monospace;color:#c9c9d2}
.bar .t{font-size:15px;font-weight:700;color:#fff}
.bar .sp{flex:1}
.bar button,.sbtn{min-width:44px;min-height:44px;border:2px solid #fff;border-radius:9px;
background:#12141b;color:#fff;font-size:13px;font-weight:600;padding:5px 9px}
.bar button:active,.sbtn:active{background:#fff;color:#000}
#aStageWrap,#bStageWrap{position:relative;flex:1 1 auto;min-height:0;touch-action:none}
#aCv{position:absolute;left:50%;top:50%;transform-origin:center center;display:block;background:#0a0713;
border:3px solid #fff;border-radius:4px}
#aMsg,#bAtk{position:absolute;left:10px;top:9px;z-index:4;font:11px/1.4 ui-monospace,monospace;
color:#ffd54a;pointer-events:none;max-width:70%;white-space:pre-wrap}
#aMsg.hot,#bAtk.hot{color:#ff6b6b;text-shadow:0 0 8px #ff6b6b}
#aFoot,#bFoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;
font:11px/1.4 ui-monospace,monospace;color:#8b90a0}
#aFoot span,#bFoot span{flex:1;min-width:0}
#aFoot button,#bFoot button{min-width:64px;min-height:44px;border:2px solid #fff;border-radius:8px;
background:#12141b;color:#fff;font:600 13px ui-monospace,monospace;padding:4px 8px}
#aFoot button:active,#bFoot button:active{background:#fff;color:#000}
/* 固定逻辑战斗框：两端同一套坐标，只整体等比缩放 */
#bBoard{position:absolute;left:50%;top:50%;width:320px;height:180px;
transform-origin:center center;border:3px solid #fff;border-radius:4px;background:#050507;overflow:hidden}
#bLayer{position:absolute;inset:0;pointer-events:none}
#bSoul{position:absolute;font-size:22px;line-height:1;transform:translate(-50%,-50%);
color:#ff2f4f;text-shadow:0 0 9px #ff2f4f;pointer-events:none;z-index:3}
#bSoul.blue{color:#4aa8ff;text-shadow:0 0 9px #4aa8ff}
#bSoul.orange{color:#ffb03a;text-shadow:0 0 9px #ffb03a}
#bSoul.hit{opacity:.25}
.hz{position:absolute;background:#f2f2f6;border:2px solid #fff;border-radius:4px;pointer-events:none;z-index:2}
.hz.bone{background:linear-gradient(180deg,#fff,#c9c9d6)}
.hz.star{background:none;border:0;font:16px/1 ui-monospace,monospace;color:#fff;border-radius:0;
width:auto!important;height:auto!important}
.hz.star.b{color:#4aa8ff}.hz.star.g{color:#8fd06a}.hz.star.o{color:#ff9a3c}
.hz.bluebone{background:linear-gradient(180deg,#7cc4ff,#2b6fb8);border-color:#9fd4ff}
.hz.warn{background:rgba(255,60,60,.16);border:2px dashed #ff5b5b}
.hz.warn:after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font:700 15px ui-monospace,monospace;color:#ff8a8a}
.hz.fire{background:linear-gradient(90deg,rgba(255,255,255,.25),#fff,rgba(255,255,255,.25));
border:0;box-shadow:0 0 18px #fff,0 0 34px #9fd4ff}
.hz.lava{background:linear-gradient(180deg,rgba(255,120,30,.15),#ff6a1e);border:2px solid #ffb03a;box-shadow:0 0 20px #ff6a1e}
#bFlash{position:absolute;inset:0;background:#f33;opacity:0;pointer-events:none;z-index:4;transition:opacity .12s}
#bGrav{position:absolute;right:5px;bottom:5px;z-index:5;min-width:44px;min-height:44px;border:2px solid #4aa8ff;
border-radius:9px;background:rgba(20,40,70,.85);color:#cfe8ff;font:700 11px ui-monospace,monospace;padding:3px}
#bGrav:active{background:#4aa8ff;color:#000}
#bGrav[hidden]{display:none}
.float{position:absolute;transform:translate(-50%,-50%);font:700 18px ui-monospace,monospace;color:#ffd54a;
text-shadow:0 0 6px #000;pointer-events:none;z-index:6;animation:fl .78s ease-out forwards}
.float.heal{color:#7dff8a}.float.hurt{color:#ff5b6e}.float.kr{color:#ff9c4a;font-size:14px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
#bTop{flex:0 0 auto;text-align:center;height:80px}
#bFoe{width:52px;height:44px;margin:0 auto;border:2px solid #fff;border-radius:12px;background:#e8e8ee;
display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
#bFoe.skull{background:#d9dde6;border-radius:50% 50% 12px 12px;box-shadow:inset 0 -6px 0 #aeb5c2}
#bFoe.flower{background:#1b2a16;border-color:#8fd06a;border-radius:50%}
#bFoe.hit{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-5deg);filter:brightness(2)}75%{transform:translateX(7px) rotate(5deg);filter:brightness(2)}}
#bLine{font:12px/1.4 ui-monospace,monospace;display:flex;justify-content:center;gap:12px;align-items:center}
#bName.ok{color:#ffd54a}
#bTrack{width:70px;height:8px;border:1px solid #fff;background:#222;display:inline-block}
#bFoeBar{display:block;height:100%;background:#7dff8a;width:100%;transition:width .2s}
/* 文字框固定高度，打字不再撑动战斗框 */
#bTalk{flex:0 0 auto;height:64px;overflow:hidden;border:2px solid #fff;border-radius:6px;
background:#000;padding:7px 10px;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap}
#bHud{flex:0 0 auto;font:12px/1.4 ui-monospace,monospace;color:#aeb4bd;display:flex;align-items:center;gap:8px}
#bHudTxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bHpWrap{flex:0 0 70px;height:9px;border:1px solid #fff;background:#222}
#bHpBar{display:block;height:100%;background:#ff2f4f;width:100%;transition:width .2s}
#bMenu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:0 0 auto}
#bSub{display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto;min-height:0}
#bSub:empty{display:none}
#bMenu button,#bSub button{min-width:44px;min-height:48px;border:2px solid #fff;border-radius:8px;
background:#12141b;color:#fff;font-size:15px;font-weight:600;padding:6px 4px}
#bMenu button:active,#bSub button:active{background:#fff;color:#000}
#bTiming{flex:1 1 100%;height:44px;position:relative;border:2px solid #fff;background:#12141b;overflow:hidden;border-radius:6px}
#bTarget{position:absolute;top:0;bottom:0;left:46%;width:8%;background:rgba(255,255,255,.18);border-left:2px solid #fff;border-right:2px solid #fff}
#bTBar{position:absolute;top:0;bottom:0;left:0;width:4px;background:#ffd54a}
#bTLabel{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:11px ui-monospace,monospace;color:#aeb4bd;pointer-events:none}
#bPick{position:absolute;inset:0;z-index:20;background:#08080b;overflow-y:auto;padding:18px}
#bPick h2{font-size:17px;text-align:center;margin:0 0 4px}
#bPick p{text-align:center;color:#8b90a0;font:12px ui-monospace,monospace;margin:0 0 12px}
.pcard{display:block;width:100%;max-width:400px;margin:0 auto 9px;min-height:76px;text-align:left;
border:2px solid #fff;border-radius:12px;background:#12141b;color:#fff;padding:9px 12px}
.pcard:active{background:#fff;color:#000}
.pcard .n{font-size:16px;font-weight:700;display:block}
.pcard .d{font:11px/1.5 ui-monospace,monospace;color:#9ba1ad;display:block;white-space:normal}
.pcard.hot{border-color:#7cc4ff;background:#101a2a}
.over{position:absolute;inset:0;z-index:21;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:10px;background:rgba(5,5,9,.93);text-align:center;padding:12px}
.over[hidden]{display:none}
.over h2{margin:0;font-size:22px;letter-spacing:2px}
.over p{margin:0;font:13px/1.7 ui-monospace,monospace;color:#c9c9d2;white-space:pre-wrap}
.over .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>

<section id="hub">
<h1>节奏与弹幕</h1>
<p>一个文件，两个互不相干的小游戏。随时切。</p>
<button class="hcard one" data-go="a"><span class="tag">玩法 ①</span>
<span class="n">🎵 几何节拍</span><span class="d">红块躲 · 蓝块吃 · 几何随拍脉冲<br>四段：推条 → 夹击 → 旋转臂 → Boss 激光<br>纯身法躲避，无冲刺 · 方向键 / 拖动都能操心</span></button>
<button class="hcard two" data-go="b"><span class="tag">玩法 ②</span>
<span class="n">❤️ 决心弹幕</span><span class="d">固定战斗框 · 四键回合战斗 · 时机条停手<br>蓝魂重力恒定 / 橙魂必须一直动 / 业报<br>方向键 / WASD / 按住画面拖动</span></button>
</section>

<section id="a">
<div class="bar"><span class="t">几何节拍</span><span id="aScore">0</span><span id="aHearts">♥♥♥</span>
<span class="sp"></span><button id="aMute">🔊</button><button id="aHub">换玩法</button></div>

</section>

<div id="bTop"><div id="bFoe"><span id="bEmoji">🪆</span></div>
<div id="bLine"><span id="bName">灰烬木偶</span><span>HP <span id="bTrack"><i id="bFoeBar"></i></span></span></div></div>

<div id="bStageWrap"><div id="bBoard"><div id="bLayer"></div><div id="bAtk"></div>

<script>
/* 游戏逻辑写这里；纯前端，无网络请求 */
var hub=document.querySelector('#hub'),rootA=document.querySelector('#a'),rootB=document.querySelector('#b');
var keys={};
window.addEventListener('keydown',function(e){
 var k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' ','spacebar'].indexOf(k)>=0)e.preventDefault();
 keys[k]=true;
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',function(){keys={}});
function axis(){return{
 x:((keys.arrowright||keys.d)?1:0)-((keys.arrowleft||keys.a)?1:0),
 y:((keys.arrowdown||keys.s)?1:0)-((keys.arrowup||keys.w)?1:0)};
}
function go(where){
 A.stop();B.stop();keys={};
 hub.style.display=where==='hub'?'block':'none';
 rootA.style.display=where==='a'?'flex':'none';
 rootB.style.display=where==='b'?'flex':'none';
 window.scrollTo(0,0);
 if(where==='a')A.start();
 if(where==='b')B.start();
}
hub.addEventListener('click',function(e){var c=e.target.closest('[data-go]');if(c)go(c.dataset.go)});

/* 相对拖动：触屏/鼠标都只取位移增量，除以舞台缩放系数 */
function bindDrag(el,active,onMove){
 var drag=false,pid=null,lx=0,ly=0;
 el.addEventListener('pointerdown',function(e){
  if(!active()||e.target.closest('button')||e.target.closest('.over'))return;
  drag=true;pid=e.pointerId;lx=e.clientX;ly=e.clientY;
  try{el.setPointerCapture(e.pointerId)}catch(err){}
 });
 el.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==pid||!active())return;
  e.preventDefault();onMove(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;
 });
 function end(e){if(e.pointerId===pid){drag=false;pid=null}}
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 return function(){drag=false;pid=null};
}

/* ================= 玩法 ①：几何节拍 ================= */
var A=(function(){
var AW=320,AH=380;
var wrap=document.querySelector('#aStageWrap'),cv=document.querySelector('#aCv'),ctx=cv.getContext('2d'),
    msg=document.querySelector('#aMsg'),scoreEl=document.querySelector('#aScore'),
    heartsEl=document.querySelector('#aHearts'),muteBtn=document.querySelector('#aMute'),
    over=document.querySelector('#aOver'),overT=document.querySelector('#aOverT'),overP=document.querySelector('#aOverP');
var k=1,px=0,py=0,running=false,raf=0,t0=0,lastBeat=-1,score=0,hp=3,
    invul=0,objs=[],rings=[],actx=null,muted=false;
var BPM=108,BEAT=60000/BPM,TOTAL=48;
var SEG=['① 推条 · 上下留缝','② 夹击 · 左右交替','③ 旋转臂 · 追踪块','④ Boss · 全屏预警'];
function fit(){
 var aw=wrap.clientWidth,ah=wrap.clientHeight;
 if(aw<10||ah<10)return;
 k=Math.min(1,aw/AW,ah/AH);
 var d=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(AW*d);cv.height=Math.round(AH*d);
 cv.style.width=AW+'px';cv.style.height=AH+'px';
 cv.style.transform='translate(-50%,-50%) scale('+k+')';
 ctx.setTransform(d,0,0,d,0,0);
 if(!px){px=AW/2;py=AH/2}
}
function tone(f,dur,type,vol){if(!actx||muted)return;try{
 var o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;
 o.type=type||'sine';o.frequency.setValueAtTime(f,n);
 g.gain.setValueAtTime(vol||.07,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);
 o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+dur);
}catch(err){}}
function audio(){if(actx)return;try{
 var C=window.AudioContext||window.webkitAudioContext;if(C){actx=new C();if(actx.state==='suspended')actx.resume()}
}catch(err){actx=null}}
function clamp(x,y){px=Math.max(10,Math.min(AW-10,x));py=Math.max(10,Math.min(AH-10,y))}
function nudge(dx,dy){clamp(px+dx/k,py+dy/k)}
var stopDrag=bindDrag(wrap,function(){return running},nudge);
muteBtn.addEventListener('click',function(){muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';if(!muted)audio()});
document.querySelector('#aHub').addEventListener('click',function(){go('hub')});
document.querySelector('#aToHub').addEventListener('click',function(){go('hub')});
document.querySelector('#aAgain').addEventListener('click',function(){start()});
function bar(x,y,w,h,warn,life,dir){objs.push({t:'bar',x:x,y:y,w:w,h:h,dir:dir||'top',
 born:performance.now(),warn:warn||0,life:life||560})}
function collect(x,y){objs.push({t:'blue',x:x,y:y,born:performance.now(),life:5200})}
function chaser(){objs.push({t:'chase',x:Math.random()*AW,y:-16,vx:0,vy:0,
 born:performance.now(),life:4200})}
function laser(horiz,pos){objs.push({t:'laser',horiz:horiz,pos:pos,born:performance.now(),warn:640,life:420})}
function onBeat(b){
 tone(b%4===0?110:82,.14,'sine',.09);tone(b%2===0?880:660,.05,'square',.022);
 rings.push({born:performance.now()});score+=1;
 var seg=Math.floor(b/12),warn=BEAT*1.15,TH=Math.max(46,AH*.24),TW=Math.max(38,AW*.17);
 if(seg===0){
  var g=Math.random()*(AW*.45)+AW*.12;
  if(b%2===0){bar(0,-2,g,TH,warn,540,'top');bar(g+70,-2,AW-g-70,TH,warn,540,'top')}
  else{bar(0,AH-TH+2,g,TH,warn,540,'bottom');bar(g+70,AH-TH+2,AW-g-70,TH,warn,540,'bottom')}
 }else if(seg===1){
  var y=AH*(.18+Math.random()*.64);
  bar(-2,y-22,TW,44,warn,520,'left');bar(AW-TW+2,y-66,TW,44,warn,520,'right');
  if(b%4===0)collect(AW*(.2+Math.random()*.6),AH*(.2+Math.random()*.6));
 }else if(seg===2){
  if(b%6===0)chaser();
  if(b%4===0)collect(AW*(.15+Math.random()*.7),AH*(.15+Math.random()*.7));
  if(b%3===0)bar(-2,Math.random()*(AH-30),AW+4,14,warn,460,'left');
 }else{
  if(b%3===0)laser(b%2===0,Math.random()*(b%2===0?AH:AW));
  if(b%4===1)collect(AW*(.2+Math.random()*.6),AH*(.2+Math.random()*.6));
  if(b%6===0)chaser();
 }
 msg.textContent=SEG[seg];msg.className=(seg===3?'hot':'');
}
function rectOf(o,f){
 if(o.dir==='top')return[o.x,o.y,o.w,o.h*f];
 if(o.dir==='bottom')return[o.x,o.y+o.h*(1-f),o.w,o.h*f];
 if(o.dir==='left')return[o.x,o.y,o.w*f,o.h];
 return[o.x+o.w*(1-f),o.y,o.w*f,o.h];
}
function distSeg(px0,py0,x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
 var t=l2?Math.max(0,Math.min(1,((px0-x1)*dx+(py0-y1)*dy)/l2)):0;
 var qx=x1+t*dx,qy=y1+t*dy;return Math.sqrt((px0-qx)*(px0-qx)+(py0-qy)*(py0-qy))}
function hit(t){if(t<invul)return;invul=t+1300;hp--;
 heartsEl.textContent='♥'.repeat(Math.max(0,hp))+'·'.repeat(3-Math.max(0,hp));
 tone(150,.25,'sawtooth',.06);if(hp<=0)end(false)}
function end(win){running=false;if(raf){cancelAnimationFrame(raf);raf=0}
 var grade=score>=560?'S':score>=460?'A':score>=340?'B':'C';
 overT.textContent=win?'通关！':'决心碎了';
 overP.textContent=(win?'48 拍全数走完':'三颗心用完了')+'\n得分 '+score+'　评级 '+grade;
 over.hidden=false}
function draw(t){
 var beatF=(t-t0)/BEAT,pulse=1-(beatF-Math.floor(beatF));
 ctx.clearRect(0,0,AW,AH);ctx.fillStyle='#0a0713';ctx.fillRect(0,0,AW,AH);
 ctx.strokeStyle='rgba(255,91,158,'+(.05+pulse*.09)+')';ctx.lineWidth=1;
 for(var gx=0;gx<AW;gx+=32){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,AH);ctx.stroke()}

 floorPillar:'④ 地板骨柱 · 依次顶起',volley:'⑤ 四向齐射'};
function hurt(dmg){
 if(F().kr){S.krUntil=performance.now()+2100;S.krTick=0;pop(sx,sy,'业报','kr');
  S.hp-=1;flash.style.opacity=.35;setTimeout(function(){flash.style.opacity=0},110)}
 else{S.hp-=dmg;pop(sx,sy,'-'+dmg,'hurt');flash.style.opacity=.45;setTimeout(function(){flash.style.opacity=0},130)}
 update();soul.classList.add('hit');setTimeout(function(){soul.classList.remove('hit')},600);
 if(S.hp<=0)lose()}
function dodge(){if(S.phase==='over')return;sub.innerHTML='';setMenu(false);S.phase='dodge';
 stopDrag();var f=F();gravBtn.hidden=!f.blue;
 if(f.blue)setGrav(1);else soul.classList.remove('blue');
 S.orange=!!f.orange;S.lastMove=performance.now();
 if(S.orange)soul.classList.add('orange');else soul.classList.remove('orange');
 var gap=Math.max(1050,1320-S.turn*20);
 dodgeEnd=performance.now()+260+(f.waves.length-1)*gap+2700;
 nextWave=performance.now()+260;waveN=0;last=0;
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(ts){
 raf=0;if(S.phase!=='dodge')return;
 if(!last)last=ts;var dt=Math.min(2.5,(ts-last)/16.7)||1;last=ts;
 var ox=sx,oy=sy;
 /* 键盘方向键：持续按住持续移动 */
 var a=axis();if(a.x||a.y)moveTo(sx+a.x*3.6*dt,sy+a.y*3.6*dt);
 /* 蓝魂重力恒定生效：按住拖动/按键照样把你往下拽 */
 if(F().blue)moveTo(sx,sy+S.grav*1.5*dt);
 /* 橙魂：必须一直动，静止就掉血（不看输入方式） */
 if(S.orange){
  if(Math.abs(sx-ox)>0.1||Math.abs(sy-oy)>0.1)S.lastMove=ts;
  else if(ts-S.lastMove>900){S.lastMove=ts;S.hp-=1;update();pop(sx,sy,'-1','kr');
   if(S.hp<=0){lose();return}}
 }
 if(S.krUntil&&ts<S.krUntil&&ts>S.krTick){S.krTick=ts+560;S.hp-=1;update();pop(sx,sy-16,'-1','kr');
  if(S.hp<=0){lose();return}}
 if(S.krUntil&&ts>=S.krUntil)S.krUntil=0;
 if(ts>nextWave&&waveN<F().waves.length){waveN++;var key=F().waves[waveN-1];
  atk(NAMES[key]||key,key==='volley');WAVES[key]();
  nextWave=ts+Math.max(1050,1320-S.turn*20)}
 for(var i=hz.length-1;i>=0;i--){var o=hz[i];if(!o||S.phase!=='dodge')break;
  var age=ts-o.born;
  if(o.warn&&age<o.warn){o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';continue}
  if(o.warn&&!o.fired){o.fired=true;o.el.classList.remove('warn');o.el.classList.add('fire')}
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  /* 只有飞出边界或定时类到点才移除，不再半途删 */
  var out=o.x<-VW-50||o.x>VW+50||o.y<-VH-50||o.y>VH+50;
  if(age>o.warn+o.ttl||out){o.el.remove();hz.splice(i,1);continue}
  o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';
  var pad=o.txt?13:8;
  if(ts>invulUntil&&sx>o.x-pad&&sx<o.x+o.w+pad&&sy>o.y-pad&&sy<o.y+o.h+pad){
   invulUntil=ts+800;hurt(o.dmg);if(S.phase!=='dodge')return}
 }
 if(S.phase==='dodge'){
  if(ts>=dodgeEnd)endDodge();else raf=requestAnimationFrame(tick)
 }
}
function endDodge(){clearH();gravBtn.hidden=true;soul.classList.remove('blue');soul.classList.remove('orange');
 S.orange=false;atk('');S.turn++;update();setMenu(true);say('* 轮到你了。* '+F().name+' 静静等着。')}
function showOver(t,p){clearH();gravBtn.hidden=true;soul.classList.remove('blue','orange');S.orange=false;atk('');
 pick.style.display='none';sub.innerHTML='';setMenu(false);S.phase='over';
 overT.textContent=t;overP.textContent=p;over.hidden=false}
function win(kind){showOver(kind?'和平结局':'战斗结束',kind?'* 你选择了仁慈。* 名字变黄的那位，散成了暖光。':'* '+F().name+' 碎成了灰。* 路通了。');
 var b=S.best[S.key];if(!b||S.turn<b){S.best[S.key]=S.turn;save();update()}}
function lose(){showOver('决心碎了','* 你的决心碎了。* ……再试一次吧。')}
function reset(){var f=F();
 S.hp=20;S.foehp=f.hp;S.foemax=f.hp;S.turn=1;S.items=3;S.buff=0;S.spare=0;
 S.grav=1;S.krUntil=0;S.orange=!!f.orange;S.lastMove=performance.now();S.phase='intro';
 clearH();sub.innerHTML='';flash.style.opacity=0;atk('');soul.classList.remove('hit','blue');foe.className=f.cls;
 gravBtn.hidden=true;pick.style.display='none';over.hidden=true;
 fit();moveTo(VW/2,VH/2);update();
 say('* '+f.name+' 又站了起来。* 你依然充满决心。',function(){setMenu(true)})}
function startFoe(key){S.key=key;reset();say(F().intro,function(){setMenu(true)})}
function showPick(){clearH();sub.innerHTML='';talk.textContent='';atk('');
 gravBtn.hidden=true;soul.classList.remove('blue','orange');S.orange=false;over.hidden=true;
 setMenu(false);S.phase='select';pick.style.display='block';renderCards()}
function renderCards(){var html='';
 FOES.forEach(function(f){html+='<button class="pcard'+(f.hot?' hot':'')+'" data-foe="'+f.key+'">'+
  '<span class="n">'+f.emoji+' '+f.name+'</span><span class="d"><b>'+f.waves.length+' 套招</b> · '+f.desc+
  (f.kr?' · 业报持续掉血':'')+(f.blue?' · 蓝魂重力恒定':'')+(f.orange?' · 必须一直动':'')+
  (S.best[f.key]?'<br>最佳 '+S.best[f.key]+' 回合':'')+'</span></button>'});
 $('#bCards').innerHTML=html}
pick.addEventListener('click',function(e){var b=e.target.closest('button[data-foe]');if(b)startFoe(b.dataset.foe)});
gravBtn.addEventListener('click',function(e){e.stopPropagation();setGrav(-S.grav)});
gravBtn.addEventListener('pointerdown',function(e){e.stopPropagation()});
$('#bAgain').addEventListener('click',function(){reset()});
$('#bPickBtn').addEventListener('click',function(){showPick()});
$('#bToHub').addEventListener('click',function(){go('hub')});
$('#bHub2').addEventListener('click',function(){go('hub')});
window.addEventListener('resize',function(){if(rootB.style.display!=='none')fit()});
function start(){fit();showPick();renderCards()}
function stop(){clearH();clearInterval(timer);timer=null;stopT();
 gravBtn.hidden=true;over.hidden=true;pick.style.display='block';
 soul.classList.remove('blue','orange','hit');flash.style.opacity=0;talk.textContent='';sub.innerHTML='';
 board.querySelectorAll('.float').forEach(function(d){d.remove()});
 atk('');S.phase='select'}
return{start:start,stop:stop};
})();

go('hub');
</script>
</body></html>
