<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HtmlGamesUnite · 次世代</title>
<style>
  /* 基础样式省略，沿用你之前的深色霓虹风即可，这里重点写新加的 */
  body { margin: 0; background: #05060c; color: #e9f1ff; font-family: system-ui, sans-serif; }
  #app { max-width: 720px; margin: 0 auto; padding: 20px; }
  
  /* 弹窗样式 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center; z-index: 9999;
    opacity: 1; transition: opacity 0.5s;
  }
  .modal-overlay.hidden { opacity: 0; pointer-events: none; }
  .modal-box {
    background: #0e1420; border: 1px solid #7fe9ff; border-radius: 16px;
    padding: 24px; max-width: 400px; width: 90%; text-align: center;
    box-shadow: 0 0 30px rgba(127,233,255,0.2);
  }
  .modal-box h2 { color: #ffc93c; margin: 0 0 12px; font-size: 20px; }
  .modal-box p { color: #8fa0bd; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  .btn { background: linear-gradient(135deg, #7fe9ff, #c77dff); color: #000; font-weight: bold; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; }

  /* 赛季 UI */
  #season-banner { background: linear-gradient(90deg, #c77dff, #7fe9ff); color: #000; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; }
  
  /* WebView 警告 */
  #webview-warn { background: #f44336; color: white; padding: 10px; font-size: 12px; text-align: center; display: none; }

  /* 卡片样式（精简） */
  .card { background: #0e1420; border: 1px solid rgba(127,233,255,0.2); padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; gap: 16px; text-decoration: none; color: inherit; }
  .card:hover { border-color: #7fe9ff; }
</style>
</head>
<body>

<!-- WebView 警告 -->
<div id="webview-warn">
  ⚠️ 检测到您正在 App 内置浏览器中访问，部分游戏（如音游）会有严重延迟，建议点击右上角选择“在浏览器中打开”。
</div>

<div id="app">
  <!-- 赛季横幅 -->
  <div id="season-banner">
    <span>⚔️ 第 1 赛季：万象更新</span>
    <span id="season-timer">剩余 30 天</span>
  </div>

  <h1 style="text-align:center; color:#7fe9ff;">HtmlGamesUnite</h1>
  <p style="text-align:center; color:#8fa0bd; margin-bottom: 24px;">包罗万象，如水流畅</p>

  <!-- 游戏列表 -->
  <div class="card" onclick="location.href='舞立方秀.html'">
    <div style="font-size:32px;">🎵</div>
    <div><h3>舞立方：秀</h3><p>6K 触屏音游</p></div>
  </div>
  
  <div class="card" onclick="startStory()">
    <div style="font-size:32px;">📖</div>
    <div><h3>主线剧情 (第 1 章)</h3><p>故事即将发生…</p></div>
  </div>
  
  <!-- 隐藏入口提示 -->
  <p style="text-align:center; margin-top:40px; font-size:12px; color:#5b6784;">
    输入特殊代码以访问隐藏系统 <span style="cursor:pointer; text-decoration:underline;" onclick="secretCode()">[ 输入代码 ]</span>
  </p>
</div>

<!-- 首次更新弹窗 -->
<div class="modal-overlay" id="welcome-modal">
  <div class="modal-box">
    <h2>下一次更新主题：值得等待</h2>
    <p>包罗万象，如水流畅。<br>故事即将发生…</p>
    <button class="btn" onclick="closeModal()">进入世界</button>
  </div>
</div>

<script>
// 1. 关闭弹窗
function closeModal() {
  document.getElementById('welcome-modal').classList.add('hidden');
  // 检查是否看过剧情
  if(!localStorage.getItem('story_read_v1')) {
    setTimeout(startStory, 1000);
  }
}

// 2. WebView 检测
(function checkWebView() {
  const ua = navigator.userAgent.toLowerCase();
  const isWebView = (ua.includes('micromessenger') || ua.includes('qq/') || ua.includes('weibo'));
  if (isWebView) {
    document.getElementById('webview-warn').style.display = 'block';
  }
})();

// 3. 密码解锁隐藏页面 (比如 Termux 控制台)
function secretCode() {
  const code = prompt("SYSTEM LOCKED.\n请输入访问代码：");
  if (code === "XIANGgo2026") {
    // 验证通过，存入凭证，跳转
    sessionStorage.setItem('auth_pass', 'true');
    location.href = 'termux.html';
  } else if (code !== null) {
    alert("代码错误，访问拒绝。");
  }
}

// 4. 剧情系统与剧情小游戏
function startStory() {
  // 弹出一个沉浸式阅读框
  const storyOverlay = document.createElement('div');
  storyOverlay.className = 'modal-overlay';
  storyOverlay.innerHTML = `
    <div class="modal-box" style="text-align: left; max-width: 500px;">
      <h2 style="text-align:center;">序章：赛博世界的裂缝</h2>
      <p id="story-text" style="min-height: 80px; color: #e9f1ff;">
        你睁开眼，发现自己身处一个由代码构筑的棋盘之上。远处的霓虹灯牌闪烁着：<br>
        "如果你能看到这行字，说明系统已经被重构。"
      </p>
      <div style="display:flex; justify-content:space-between; margin-top:20px;">
        <button class="btn" style="background:#26304a; color:#fff;" onclick="this.parentElement.parentElement.parentElement.remove()">跳过</button>
        <button class="btn" id="story-next">继续</button>
      </div>
    </div>
  `;
  document.body.appendChild(storyOverlay);

  let step = 0;
  document.getElementById('story-next').onclick = () => {
    step++;
    const textEl = document.getElementById('story-text');
    if (step === 1) {
      textEl.innerHTML = "前方出现了一个奇怪的终端。你需要输入正确的指令才能唤醒它。";
    } else if (step === 2) {
      // 仅剧情时的小游戏：猜密码
      textEl.innerHTML = "终端上闪烁着一行提示：<br><i>Hint: 我们的世界叫什么名字？(全拼小写)</i><br><br><input id='story-input' style='width:100%; padding:8px; background:#000; border:1px solid #7fe9ff; color:#fff;' placeholder='输入指令...'>";
      document.getElementById('story-next').innerText = "执行";
      document.getElementById('story-next').onclick = () => {
        const val = document.getElementById('story-input').value.trim().toLowerCase();
        if (val === 'htmlgamesunite' || val === 'xianggo') {
          textEl.innerHTML = "唤醒成功！世界之树重新焕发生机。<br><br>你获得了成就【世界的重构者】。";
          document.getElementById('story-next').innerText = "完成";
          document.getElementById('story-next').onclick = () => {
            storyOverlay.remove();
            localStorage.setItem('story_read_v1', '1');
            alert("剧情已保存。游戏列表已解锁。");
          };
        } else {
          alert("指令错误，终端无响应。再想想？");
        }
      };
      return; // 阻止默认下一步
    }
  };
}

// 5. 防审查/防F12系统
(function antiInspect() {
  // 禁用右键
  document.addEventListener('contextmenu', e => e.preventDefault());
  
  // 检测 F12 / Ctrl+Shift+I / Ctrl+U
  document.addEventListener('keydown', e => {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
    ) {
      e.preventDefault();
      // 恶心人的无限 debugger
      setInterval(() => { debugger; }, 50);
      document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>ACCESS DENIED</h1><p style='text-align:center;'>试图窥探底层代码是被禁止的。</p>";
    }
  });
})();
</script>
</body>
</html>
