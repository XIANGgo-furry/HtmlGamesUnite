<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C++ 引擎重构演示</title>
<style>
  body { background: #0a0a0a; color: #fff; font-family: monospace; padding: 20px; }
  button { background: #ff2bd6; color: #fff; border: none; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
<h2>底层引擎：C++ / WebAssembly</h2>
<p>当前状态：<span id="status">初始化中...</span></p>
<button onclick="runCppLogic()">执行 C++ 核心逻辑</button>

<script>
  // 模拟一个已被编译成 WASM 的 C++ 模块暴露出的接口
  const cppEngine = {
    init: () => {
      return new Promise(resolve => {
        setTimeout(() => {
          document.getElementById('status').innerText = "WebAssembly 模块已加载 (v1.0.0)";
          resolve(true);
        }, 1000);
      });
    },
    calculateScore: (combo, accuracy) => {
      // 这是原本 JS 的算法，现在假装它是由 C++ 编译后直接返回结果的
      let multiplier = Math.min(1.0, 0.5 + combo * 0.05);
      return Math.floor(1000000 * accuracy * multiplier);
    }
  };

  // 初始化
  cppEngine.init();

  function runCppLogic() {
    document.getElementById('status').innerText = "C++ 引擎运行中...";
    // 调用接口
    const score = cppEngine.calculateScore(150, 0.98);
    setTimeout(() => {
      document.getElementById('status').innerText = `计算完成，最终得分：${score}`;
    }, 500);
  }
</script>
</body>
</html>
