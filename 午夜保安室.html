<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>午夜兽兽馆</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#e7ddc9;
  background:radial-gradient(ellipse at 50% -10%,#3c372f 0%,#1a1a1e 55%,#08090c 100%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px);
  display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100%,1100px);height:100%;display:flex;flex-direction:column;gap:10px;
  padding:52px 14px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 11%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px),
  linear-gradient(180deg,#35322c,#222225 48%,#181a1d);
  border:2px solid #0b0c0f;border-radius:20px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.11),inset 0 -4px 0 rgba(0,0,0,.6),
  0 0 0 3px #5c554a,0 0 0 6px #141518,0 18px 50px rgba(0,0,0,.85)}
#app::before,#app::after{content:"";position:absolute;top:11px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#a89d89,#565044 60%,#201e1a);
  box-shadow:inset 0 0 0 1px #100f0d,0 1px 2px #000}
#app::before{left:11px} #app::after{right:11px}
#brand{position:absolute;top:16px;left:0;right:0;text-align:center;pointer-events:none;
  font:700 11px/1 ui-monospace,monospace;letter-spacing:3px;color:#978c76;text-shadow:0 1px 0 #000}
#back{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:99999;
  min-width:44px;min-height:44px;padding:10px 14px;color:#fff;font-size:15px;text-decoration:none;
  border:1px solid #0b0c0f;border-radius:11px;
  background:linear-gradient(180deg,#4b5057,#292e34 55%,#1b1f24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.5),0 3px 0 #0c0e11,0 5px 10px #000a;
  font-weight:800;text-shadow:0 1px 1px #000;user-select:none}
#back:active{transform:translateY(2px)}
noscript{position:fixed;top:60px;left:8px;z-index:99999;color:#ffcf6b;font-size:13px}

/* 锈蚀/老旧（连败惩罚） */
#rust{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:
   radial-gradient(ellipse at 12% 22%,rgba(139,69,25,.55),transparent 24%),
   radial-gradient(ellipse at 86% 16%,rgba(112,54,20,.48),transparent 22%),
   radial-gradient(ellipse at 70% 88%,rgba(96,48,18,.42),transparent 28%),
   repeating-linear-gradient(28deg,rgba(120,60,24,.10) 0 2px,transparent 2px 9px)}
body.decay #rust{opacity:.72}
body.decay #app{filter:sepia(.24) contrast(1.1) brightness(.93)}
body.decay #crt .scan{opacity:.9}
body.decay #hud{filter:sepia(.3)}

/* HUD */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;letter-spacing:.5px;
  background:linear-gradient(180deg,#403d37,#242529 55%,#191b1f);
  border:1px solid #0c0d10;border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -2px 5px rgba(0,0,0,.7),0 3px 8px #0009}
#hud .cell{display:flex;align-items:center;gap:7px;white-space:nowrap}
#hud .label{color:#a99e87;font-size:11px;font-weight:700;letter-spacing:1px}
#hud .big{font:800 18px/1.2 ui-monospace,monospace;color:#ffd07a;font-variant-numeric:tabular-nums;
  padding:3px 9px;border-radius:6px;border:1px solid #050607;background:#0a0d10;
  box-shadow:inset 0 2px 6px #000,0 1px 0 rgba(255,255,255,.10);text-shadow:0 0 10px rgba(255,179,71,.55)}
#powerWrap{position:relative;flex:1 1 auto;min-width:90px;height:16px;overflow:hidden;
  border-radius:9px;border:1px solid #090a0c;
  background:linear-gradient(180deg,#05070a,#14181d 45%,#05070a);
  box-shadow:inset 0 2px 5px #000,0 1px 0 rgba(255,255,255,.10)}
#powerWrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(0,0,0,.5) 9% calc(9% + 2px))}
#powerBar{height:100%;width:100%;background:linear-gradient(180deg,#8ff0b0,#39c47a 55%,#1b8a52);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.3),0 0 12px rgba(90,230,150,.5);
  transition:width .12s linear,background .3s}
#powerBar.mid{background:linear-gradient(180deg,#ffe08a,#f0a13c 55%,#b56f17)}
#powerBar.low{background:linear-gradient(180deg,#ff9b7a,#ef4d3d 55%,#9c2118)}
#powerBar.crit{animation:blink .35s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#btnPause{flex:0 0 auto;min-width:44px;min-height:44px;padding:6px 10px;cursor:pointer;
  border:1px solid #0b0c0f;border-radius:10px;color:#d8e0e6;font-size:15px;font-weight:800;
  background:linear-gradient(180deg,#4a4f55,#2c3137 55%,#1d2126);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -2px 0 rgba(0,0,0,.5),0 3px 0 #0c0e11,0 5px 9px #0008;
  text-shadow:0 1px 1px #000;user-select:none}
#btnPause:active{transform:translateY(2px)}

/* 显像管 */
#screen{position:relative;flex:1 1 auto;min-height:0;width:100%;background:#000;border:0;
  border-radius:26px / 20px;overflow:hidden;
  box-shadow:inset 0 0 0 3px #0a0c0f,inset 0 0 0 11px #23262b,inset 0 0 42px #000,
  0 0 0 3px #4d4840,0 0 0 7px #131417,0 8px 22px rgba(0,0,0,.75)}
#stage{display:block;width:100%;height:100%;object-fit:contain;touch-action:manipulation}
#crt{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;overflow:hidden}
#crt i{position:absolute;display:block;inset:0}
#crt .scan{background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0px,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px),
  radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.36) 100%);mix-blend-mode:multiply}
#crt .snow{inset:-25%;background:
  repeating-linear-gradient(62deg,rgba(255,255,255,.085) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(-28deg,rgba(255,255,255,.06) 0 1px,transparent 1px 6px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 7px);
  background-size:83px 79px,107px 61px,53px 47px;opacity:.22;animation:snowJ .18s steps(3) infinite}
#crt .roll{background:linear-gradient(180deg,transparent 0%,rgba(180,225,255,.03) 42%,
  rgba(205,238,255,.10) 50%,rgba(180,225,255,.03) 58%,transparent 100%);
  background-size:100% 220%;opacity:.55;animation:roll 8s linear infinite}
#crt .glass{background:linear-gradient(112deg,transparent 34%,rgba(190,225,255,.055) 47%,transparent 58%),
  radial-gradient(ellipse at 50% 6%,rgba(255,255,255,.05),transparent 55%);
  box-shadow:inset 2px 0 0 rgba(255,60,60,.05),inset -2px 0 0 rgba(60,160,255,.06);
  animation:flick 3.1s steps(1) infinite}
@keyframes snowJ{0%{background-position:0 0,0 0,0 0}33%{background-position:19px -11px,-13px 9px,7px 5px}
  66%{background-position:-9px 13px,11px -7px,-5px 9px}100%{background-position:5px -5px,-17px 13px,9px -3px}}
@keyframes roll{0%{background-position:0 -120%}100%{background-position:0 120%}}
@keyframes flick{0%,97%{opacity:1}98%{opacity:.86}99%{opacity:1}100%{opacity:.94}}

/* 底部只留监控键 */
#controls{flex:0 0 auto;display:flex;justify-content:center}
#btnCam{min-width:190px;min-height:56px;padding:10px 20px;border-radius:11px;cursor:pointer;
  border:1px solid #0b0d10;color:#d3dae1;font-size:14px;font-weight:800;text-align:center;
  background:linear-gradient(180deg,#4d5258,#34393f 42%,#23272c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.45),
  0 4px 0 #0c0e11,0 6px 10px rgba(0,0,0,.7);text-shadow:0 1px 1px #000;user-select:none;
  transition:transform .07s,box-shadow .07s,background .15s,color .15s}
#btnCam:active{transform:translateY(3px);box-shadow:inset 0 2px 6px rgba(0,0,0,.78),0 1px 0 #0c0e11}
#btnCam.on{background:linear-gradient(180deg,#b6f5cf,#49c98a 45%,#238a5b);color:#062017;border-color:#1a6a44;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(10,70,45,.5),
  0 4px 0 #124833,0 0 18px rgba(80,240,160,.45)}

/* 面板 */
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(8,10,14,.68),rgba(2,3,6,.88));padding:18px}
#overlay.hidden{display:none}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;padding:20px 20px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 10%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),
  linear-gradient(180deg,#35332e,#202225 60%,#15171a);
  border:2px solid #0b0c0f;border-radius:18px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.13),inset 0 -4px 0 rgba(0,0,0,.55),
  0 0 0 3px #5b554b,0 0 0 5px #15161a,0 20px 60px #000}
.panel h1{margin:0 0 6px;font-size:24px;color:#ffcf6b;letter-spacing:2px;text-shadow:0 2px 0 #000,0 0 18px rgba(255,174,61,.35)}
.panel h2{margin:0 0 12px;font-size:20px;letter-spacing:1px;color:#e7ddc9;text-shadow:0 1px 0 #000}
.panel p{margin:8px 0;font-size:13px;line-height:1.7;color:#c6bfae}
.panel .sub{color:#968c79;font-size:12px}
.panel ul{text-align:left;font-size:12.5px;line-height:1.85;color:#c6bfae;margin:12px 0;padding-left:20px}
.warn{color:#ff9a86 !important} .ok{color:#8be8ae !important}
.menuBtn{display:block;width:100%;min-height:54px;margin-top:9px;padding:12px 14px;text-align:left;
  color:#dde4eb;cursor:pointer;user-select:none;border:1px solid #0b0d10;border-radius:11px;
  background:linear-gradient(180deg,#474c52,#2e3339 45%,#202429);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -3px 0 rgba(0,0,0,.45),0 4px 0 #0c0e11,0 6px 10px #0008;
  font:800 14px/1.35 inherit;text-shadow:0 1px 1px #000}
.menuBtn small{display:block;font-weight:600;font-size:11px;color:#8d99a5;margin-top:4px;text-shadow:none}
.menuBtn:active{transform:translateY(3px);box-shadow:inset 0 2px 6px #000a}
.menuBtn.primary{background:linear-gradient(180deg,#ffdf91,#e8ad3f 45%,#c5871f);color:#2a1a06;
  border-color:#6b4410;text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(120,70,10,.5),
  0 4px 0 #4a2c08,0 0 18px rgba(255,180,60,.35)}
.menuBtn.primary small{color:#6d4715}
.menuBtn.ghost{min-height:46px;padding:10px;text-align:center;font-size:12px;
  background:linear-gradient(180deg,#3a3e43,#202428);color:#a9b7c4}
.nightGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px}
.nightCard{min-height:50px;padding:8px 2px;border-radius:10px;cursor:pointer;user-select:none;
  border:1px solid #0b0d10;color:#c8d6e2;background:linear-gradient(180deg,#474c52,#2c3137 55%,#1e2227);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 0 rgba(0,0,0,.5),0 3px 0 #0c0e11;
  font:800 16px/1 ui-monospace,monospace}
.nightCard small{display:block;font:600 9px/1.4 inherit;color:#7c8996;margin-top:5px}
.nightCard.on{background:linear-gradient(180deg,#ffdf91,#e8ad3f 45%,#c5871f);color:#2a1a06;border-color:#6b4410;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 16px rgba(255,180,60,.45),0 3px 0 #4a2c08}
.nightCard.on small{color:#6d4715}
.nightCard.lock{opacity:.38;cursor:not-allowed;border-style:dashed;box-shadow:inset 0 2px 8px #000}
.sliderRow{display:flex;align-items:center;gap:10px;margin:8px 0;min-height:44px;text-align:left}
.sliderRow label{flex:0 0 76px;font-size:12px;color:#cfc6b2;font-weight:800}
.sliderRow input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:36px;background:transparent;cursor:pointer}
.sliderRow input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:7px;border:1px solid #08090b;
  background:linear-gradient(180deg,#05070a,#20252b 45%,#05070a);box-shadow:inset 0 2px 5px #000}
.sliderRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;
  margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ded7c7,#8c8577 55%,#48443c);
  border:2px solid #26241f;box-shadow:0 2px 4px #000b}
.sliderRow input[type=range]::-moz-range-track{height:12px;border-radius:7px;border:1px solid #08090b;
  background:linear-gradient(180deg,#05070a,#20252b 45%,#05070a)}
.sliderRow input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#ded7c7,#8c8577 55%,#48443c);border:2px solid #26241f}
.sliderRow output{flex:0 0 36px;text-align:right;font:800 15px ui-monospace,monospace;color:#ffcf6b}
.preset{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:64px;margin:3px;
  padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer;user-select:none;color:#c6dbe9;
  border:1px solid #0b0d10;border-radius:22px;background:linear-gradient(180deg,#3d4a54,#212a32 55%,#172027);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.5),0 3px 0 #0c0e11}
.preset:active{transform:translateY(2px)}

/* 跳杀层 */
#scareCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:9000;display:none;background:#000;pointer-events:none}
#scareCanvas.on{display:block}
body.scareOn #app{filter:brightness(.25) contrast(1.6)}
body.shake{animation:shk .055s infinite}
body.shake #app{animation:shk2 .07s infinite}
@keyframes shk{0%{transform:translate(4px,2px)}25%{transform:translate(-6px,-4px)}50%{transform:translate(3px,6px)}75%{transform:translate(-5px,-2px)}100%{transform:translate(5px,-4px)}}
@keyframes shk2{0%{transform:translate(-3px,1px) rotate(-.3deg)}50%{transform:translate(4px,-3px) rotate(.4deg)}100%{transform:translate(-2px,3px) rotate(-.2deg)}}

/* 预加载 / 警告声明 */
#boot{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;
  padding:18px;background:radial-gradient(ellipse at center,#10141a,#030507 78%)}
#boot.hidden{display:none}
.bootBox{width:min(620px,100%);max-height:100%;overflow:auto;padding:22px 22px 20px;text-align:left;
  border:2px solid #0b0c0f;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 9%),
  repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#33312c,#1d2024 60%,#141619);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.6),
  0 0 0 3px #5b554b,0 0 0 5px #15161a,0 20px 60px #000}
.bootBox h1{margin:0 0 4px;font:800 20px/1.3 ui-monospace,monospace;color:#ffcf6b;letter-spacing:2px}
.bootBox h2{margin:0 0 12px;font:800 19px/1.4 inherit;color:#ffb08a;letter-spacing:1px}
.bootBox .sub{font-size:11px;color:#8e9aa6;letter-spacing:1px;margin:0 0 14px}
#bootLog{font:12px/1.9 ui-monospace,monospace;color:#8fe0b6;min-height:190px;white-space:pre-wrap}
#bootLog .dim{color:#5f7d6e}
#bootBar{height:12px;margin-top:12px;border-radius:7px;border:1px solid #08090b;overflow:hidden;
  background:#05070a;box-shadow:inset 0 2px 5px #000}
#bootBarIn{height:100%;width:0;background:linear-gradient(180deg,#9ff0bd,#37c47a 55%,#1b8a52);
  box-shadow:0 0 12px rgba(90,230,150,.5);transition:width .12s linear}
.warnList{text-align:left;font-size:12.5px;line-height:1.85;color:#d8cfbb;margin:10px 0;padding-left:20px}
.warnList li{margin-bottom:5px}
.bootBox .menuBtn{margin-top:12px;text-align:center}
#bootBack{display:inline-block;margin-top:14px;min-height:44px;padding:10px 14px;color:#a9b7c4;
  font-size:12px;text-decoration:none;border:1px solid #0b0c0f;border-radius:10px;
  background:linear-gradient(180deg,#3a3e43,#202428)}

@media (max-width:520px){
  #app{padding:52px 8px 8px;gap:7px;border-radius:14px}
  #brand{display:none}
  #hud{padding:6px 8px;gap:6px;font-size:11px}
  #hud .big{font-size:15px;padding:2px 6px}
  #btnCam{min-height:52px;font-size:13px}
  .panel{padding:14px 12px}
  .nightGrid{gap:4px}
  .nightCard{min-height:46px;font-size:14px}
  .nightCard small{font-size:8px}
  .bootBox{padding:16px 14px}
  #bootLog{font-size:11px;min-height:170px;line-height:1.75}
}
</style></head><body>

<div id="app">
  <div id="brand">FURRY · NIGHT WATCH</div>
  <div id="rust"></div>
  <div id="hud">
    <div class="cell"><span class="label">时间</span><span class="big" id="hudTime">12 AM</span></div>
    <div class="cell"><span class="label">夜</span><span class="big" id="hudNight">0</span></div>
    <div class="cell" style="flex:1 1 auto"><span class="label">电量</span><div id="powerWrap"><div id="powerBar"></div></div><span class="big" id="hudPower" style="font-size:14px;min-width:42px;text-align:right">100%</span></div>
    <button id="btnPause" title="暂停 / 继续">⏸</button>
  </div>

  <div id="screen">
    <canvas id="stage" width="960" height="540"></canvas>
    <div id="crt"><i class="scan"></i><i class="snow"></i><i class="roll"></i><i class="glass"></i></div>
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>

  <div id="controls"><div class="btn" id="btnCam">监控</div></div>
</div>

<canvas id="scareCanvas"></canvas>

<div id="boot"><div class="bootBox" id="bootBox"></div></div>

<script>
/* =========================================================================
   午夜兽兽馆 · 单文件 / 无外部资源
   15 夜（含第零夜）· 两页监控地图 · 画面内实体开关
   ========================================================================= */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('stage');
  var ctx = canvas.getContext('2d');
  var W = 960, H = 540;
  canvas.width = W; canvas.height = H;

  /* ---------- 配置 ---------- */
  var SEC_PER_HOUR = 40;
  var NIGHT_SEC = SEC_PER_HOUR * 6;              // 240 秒
  var AM5 = SEC_PER_HOUR * 5;                    // 200 秒
  var HOUR_LABEL = ['12 AM', '1 AM', '2 AM', '3 AM', '4 AM', '5 AM', '6 AM'];
  var DOOR_REACT_MIN = 4.5, DOOR_REACT_RANGE = 2.5;
  var SCARE_PRE_SEC = 0.13, SCARE_MAIN_SEC = 1.8;
  var RED_SEC = 0.9;                 // 跳杀结束后的全屏红屏时长
  var SCARE_SOUND_SEC = SCARE_PRE_SEC + SCARE_MAIN_SEC;
  var STORE_KEY = 'midnight_office_night', STORE_FAIL = 'midnight_office_fail', STORE_DECAY = 'midnight_office_decay';
  var DECAY_LIMIT = 5;

  /* 耗电（%/秒）：门 > 灯 > 监控 > 干等
     干等 240s × 0.1375 = 33% → 剩 67%
     双门常关 (0.1375+0.92) → 5 AM 前归零；双灯常开 (0.1375+0.60) → 5 AM 前归零 */
  var DRAIN_BASE = 0.1375, DRAIN_CAM = 0.045, DRAIN_LIGHT = 0.30, DRAIN_DOOR = 0.46;

  var LAST_NIGHT = 14;
  var ATTACKERS = [2, 1, 1, 1, 2, 2, 2, 3, 4, 5, 6, 6, 6, 6, 6];  // 第零夜 2 只低频，之后前慢后快
  var NIGHT_NAMES = ['第零夜', '第一夜', '第二夜', '第三夜', '第四夜', '第五夜', '第六夜', '第七夜',

  /* ---------- 游走毛团：圆滚滚的小家伙（盯久了会凑过来做鬼脸） ---------- */

  /* ---------- 700ms 怼脸：只在监控画布内，不进死亡层、不改 state ---------- */
  function drawSparkFlash() {
    var f = sparkFlash;
    if (!f) return;
    var k = Math.min(1, f.t / f.dur);
    fillR(0, 0, W, H, '#03060a');

    // 越往后怼得越近：起步就几乎贴脸，结束时超出画面
    var scale = 2.2 + k * 2.6;
    // 红 / 青 色差重影
    ctx.save();
    ctx.globalAlpha = .30; ctx.translate(-26, 4);
    drawSpark(W / 2, H / 2 + 30, scale, true);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = .22; ctx.translate(26, -4);
    drawSpark(W / 2, H / 2 + 30, scale, true);
    ctx.restore();
    fillR(0, 0, W, H, 'rgba(255,40,40,.075)');

    // 主体：带抖动
    var jx = (Math.random() - .5) * 34 * (1 - k * .35);
    var jy = (Math.random() - .5) * 24 * (1 - k * .35);
    drawSpark(W / 2 + jx, H / 2 + 30 + jy, scale, true);
    fillR(0, 0, W, H, 'rgba(70,210,255,.05)');

    // 撕裂横条
    for (var b = 0; b < 5; b++) {
      var y = Math.random() * H, hh = 3 + Math.random() * 15;
      fillR(Math.random() * 30 - 30, y, W + 60, hh,
            Math.random() > .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.42)');
    }
    // 加密扫描线
    ctx.fillStyle = 'rgba(0,0,0,.26)';
    for (var y2 = 0; y2 < H; y2 += 3) ctx.fillRect(0, y2, W, 1);
    // 暗角
    var vg = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 640);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(.7, 'rgba(30,0,0,.30)');
    vg.addColorStop(1, 'rgba(0,0,0,.82)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // 起手白闪
    if (k < .10) fillR(0, 0, W, H, 'rgba(238,248,255,' + (0.88 - k * 8) + ')');
    // 收尾淡出
    if (k > .86) fillR(0, 0, W, H, 'rgba(0,0,0,' + ((k - .86) / .14 * .92) + ')');
  }

  /* ---------- 夜巡室风口：不能关门，但开灯能照亮并逼退 ---------- */
  function drawVentPort(side) {

    if (!blackout) {

  /* ---------- 两页地图 ---------- */

    });
    else if (act === 'retry') startGame(mode, nightCfg);
    else if (act === 'next') { selNight = Math.min(LAST_NIGHT, nightCfg.n + 1); startGame('normal', NIGHTS[selNight]); }
    else if (act === 'resume') resumeGame();

  $('panel').addEventListener('input', function (e) {

  /* ---------- 预加载 / 警告声明 ---------- */
  var BOOT_LINES = [
    '显像管预热 ................', '馆内画面 10 路 ............',

  function bootTick(dt) {

  /* ---------- 开局 / 暂停 / 胜负 ---------- */
  function startGame(m, cfg) {
    audio(); startHum();

    state = 'playing';
    t = 0; power = 100; hourIdx = 0;

    doorL = doorR = lightL = lightR = false;

    blackout = false; blackoutTimer = 0; scare = null;
    lowWarned = false; critWarned = false;
    musicBox = 100; bbState = 'idle'; bbTimer = 0; bbPos = 0; bbStealTick = 0;
    winding = false; windTick = 0;
    foxyProgress = 0; foxyState = 'lair'; foxyTimer = 0; foxyPenalty = 0;
    foxyDoorSide = 'L'; foxyCharged = false;

                side: 'L', progress: 0, atVent: false, timer: 0 };
    crawler.side = crawler.cam === 'V1' ? 'L' : 'R';
    sparks = []; sparkFlash = null; sparkNext = 12 + Math.random() * 10;
    mapPage = 'facility'; introAnim = 1.6; dayAnim = 0;
    anims = makeAnims();

    hidePanel(); syncBtns(); renderHUD();
  }
  function pauseGame() {
    if (state !== 'playing') return;

    sparks.forEach(function (x) { x.watch = 0; });
    showPanel('<h2>⏸ 已暂停</h2>' +
      '<p class="sub">' + nightName + ' · ' + HOUR_LABEL[Math.min(6, hourIdx)] +
      ' · 电量 ' + Math.max(0, Math.round(power)) + '%</p>' +
      '<button class="menuBtn primary" data-act="resume">▶ 继续值班</button>' +
      '<button class="menuBtn ghost" data-act="quit">退出到主菜单</button>');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing'; last = performance.now(); hidePanel();
  }
  $('btnPause').addEventListener('click', function () {
    if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
  });
  function startScare(id) {
    if (state !== 'playing') return;
    sparkFlash = null;
    state = 'jumpscare';
    scare = { id: id, t: 0, dur: SCARE_SOUND_SEC, startAt: frameNow, sfxDone: false, sfxAt: 0 };
    camOpen = false; syncBtns(); sizeScare();
    scareCanvas.className = 'on';
    document.body.classList.add('shake', 'scareOn');
    sfxPreScare();
  }
  function endScareFx() {
    scareCanvas.className = '';
    document.body.classList.remove('shake', 'scareOn');
  }
  function lose(reason) {
    endScareFx(); state = 'lose'; winding = false; sparkFlash = null;
    noteFail();
    var tip;
    if (/电耗尽/.test(reason)) {
      tip = '<p class="ok">耗电排序：<b>关闸 &gt; 开灯 &gt; 开监控 &gt; 什么都不做</b>。'
          + '两扇闸门一直关、或两个灯一直开，5 AM 前必没电；用完立刻松手。</p>';
    } else if (/赤尾狐/.test(reason)) {
      tip = '<p class="ok">常回 <b>F3 绒绒窝</b> 盯一眼，窝帘开到它完全站起时就快跑出来了；'
          + '跑出来后关上左闸门挡一会儿（会扣 3~5% 电）。</p>';
    } else if (/风管|风口/.test(reason)) {
      tip = '<p class="ok">风口<b>没有闸门，关不住</b>：切到 <b>V1 / V2</b> 盯着它，'
          + '或者<b>开同侧的灯</b>把它照回去。开灯也能看见风口里的东西。</p>';
    } else if (nightCfg.tutorial) {
      tip = '<p class="ok">教程夜反应时间很长：<b>开门口灯</b>从观察窗看清是谁，'
          + '<b>关上那一侧的闸门</b>等约 2.6 秒把它逼退，之后再开闸。闸门和灯都很费电，用完记得关。</p>';
    } else {
      tip = '<p class="ok">贴门后有 <b>4.5~7 秒</b>反应：开灯从观察窗确认，关闸约 2.6 秒逼退，然后记得开闸。</p>';
    }
    showPanel('<h2 class="warn">☠ 你没能撑到天亮</h2><p>' + reason + '</p>' +
      '<p class="sub">' + nightName + ' · 存活 ' + Math.floor(t) + ' 秒 · 到达 ' + HOUR_LABEL[Math.min(6, hourIdx)] +
      ' · 剩余电量 ' + Math.max(0, Math.round(power)) + '%</p>' + tip +
      (decay ? '<p class="warn">连着失手，馆里都蒙上旧影子了。</p>' : '') +
      '<button class="menuBtn primary" data-act="retry">再来一局</button>' +
      '<button class="menuBtn ghost" data-act="main">← 主菜单</button>');
  }
  function beginWin() {
    if (state !== 'playing') return;
    state = 'daybreak'; dayAnim = 0; hourIdx = 6; sparkFlash = null;
    camOpen = false; syncBtns(); renderHUD();
    sfxWin(); sfxDawn();
  }
  function finishWin() {
    if (state !== 'daybreak') return;
    state = 'win'; noteWin();
    var isNormal = mode === 'normal' && !nightCfg.custom && nightCfg.n >= 0;
    var nextBtn = (isNormal && nightCfg.n < LAST_NIGHT)
      ? '<button class="menuBtn primary" data-act="next">▶ 进入' + NIGHTS[nightCfg.n + 1].name + '</button>' : '';
    var msg = (isNormal && nightCfg.n === LAST_NIGHT) ? '<p class="ok">🏆 十五夜全通关。</p>' :
              '<p>天亮了，兽兽们回窝睡觉啦～</p>';
    if (isNormal) saveUnlock(Math.min(LAST_NIGHT, nightCfg.n + 1));
    showPanel('<h2 class="ok">⏰ 6:00 AM</h2><h1>你守过了' + nightName + '</h1>' + msg +
      '<p class="sub">用时 ' + Math.floor(t) + ' 秒 · 剩余电量 ' + Math.max(0, Math.round(power)) +
      '% · 值守 6 个小时</p>' + nextBtn +
      '<button class="menuBtn' + (nextBtn ? '' : ' primary') + '" data-act="retry">再来一局</button>' +
      '<button class="menuBtn ghost" data-act="main">← 主菜单</button>');
  }

  /* ---------- 逻辑更新 ---------- */
  function moveInterval() {
    var base = Math.max(3.6, 6.0 - Math.min(5, hourIdx) * 0.42);
    return nightCfg.tutorial ? base * 1.35 : base;  // 教程夜移动更慢
  }
  function aiLevel(a) { return Math.min(20, a.ai * (0.6 + 0.4 * (Math.min(5, hourIdx) / 5))); }

  function update(dt) {
    if (state !== 'playing') return;
    t += dt;
    hourIdx = Math.min(6, Math.floor(t / SEC_PER_HOUR));
    if (t >= NIGHT_SEC - 0.1) { if (blackout) startScare('rust'); else beginWin(); return; }

    /* 耗电：门 > 灯 > 监控 > 干等 */
    var drain = DRAIN_BASE;
    if (camOpen) drain += DRAIN_CAM;
    if (lightL) drain += DRAIN_LIGHT;
    if (lightR) drain += DRAIN_LIGHT;
    if (doorL)  drain += DRAIN_DOOR;
    if (doorR)  drain += DRAIN_DOOR;
    power -= drain * dt;
    if (foxyPenalty > 0) {
      power = Math.max(0, power - foxyPenalty);
      foxyPenalty = 0;
    }
    if (power < 50 && !lowWarned) { lowWarned = true; sfxLowPower(); }
    if (power < 20 && !critWarned) { critWarned = true; sfxLowPower(); }
    if (power <= 0 && !blackout) {
      power = 0; blackout = true;
      doorL = doorR = lightL = lightR = false; camOpen = false;
      sparkFlash = null; sparks.forEach(function (x) { x.watch = 0; });
      blackoutTimer = 3.5 + Math.random() * 2.5;
      syncBtns(); sfxBlackout();
    }
    if (blackout) {
      blackoutTimer -= dt;
      if (blackoutTimer <= 0) startScare('rust');
      return;
    }

    /* ---- 游走电偶：盯久了怼脸 0.7 秒，纯吓唬 ---- */
    if (sparkFlash) {
      sparkFlash.t += dt;
      if (sparkFlash.t >= sparkFlash.dur) sparkFlash = null;
    }
    sparkNext -= dt;
    if (sparkNext <= 0) {
      var alive = sparks.filter(function (x) { return !x.dead && !x.triggered; });
      if (alive.length < 2) {
        var pool = SPARK_CAMS.filter(function (id) {
          return !alive.some(function (x) { return x.cam === id; });
        });
        var count = Math.min(pool.length, Math.random() < .35 ? 2 : 1);
        for (var si = 0; si < count; si++) {
          var pick = Math.floor(Math.random() * pool.length);
          var camId = pool.splice(pick, 1)[0];
          sparks.push({
            cam: camId, life: 10 + Math.random() * 8,
            watch: 0, triggerAt: (decay ? 1.5 : 2.2) + Math.random() * 1.6,
            variant: Math.floor(Math.random() * 3),
            seed: Math.random() * 1000, triggered: false, dead: false
          });
        }
      }
      sparkNext = (decay ? 9 : 16) + Math.random() * 10;
    }
    var watching = camOpen && !blackout;
    for (var s = 0; s < sparks.length; s++) {
      var sp = sparks[s];
      if (sp.dead || sp.triggered) continue;
      sp.life -= dt;
      if (sp.life <= 0) { sp.dead = true; continue; }
      if (watching && sp.cam === curCam) {
        sp.watch += dt;
        if (sp.watch >= sp.triggerAt) {
          sp.triggered = true; sp.dead = true;
          sparkFlash = { t: 0, dur: SPARK_FLASH_SEC, variant: sp.variant };
          sfxSpark(); sparkNext = Math.max(sparkNext, 8);
        }
      } else sp.watch = 0;
    }
    if (sparks.length > 24) sparks = sparks.filter(function (x) { return !x.dead; });

    /* ---- 铃尾浣：摇铃停下 → 沿风管 → 风口探头偷 2~3% ---- */
    var bb = animById('chime');
    if (bb && bb.enabled) {
      if (bbState === 'idle') {
        if (winding && camOpen && curCam === WIND_CAM) {
          musicBox = Math.min(100, musicBox + 24 * dt);
          windTick += dt;
          if (windTick > 0.4) { windTick = 0; sfxWind(); }
        } else {
          windTick = 0; musicBox -= 1.5 * dt;
        }
        if (musicBox <= 0) {
          musicBox = 0; bbState = 'moving'; bbPos = 0; bbTimer = 3.6;
          bb.pos = 0; sfxVent();
        }
      } else if (bbState === 'moving') {
        bbTimer -= dt;
        if (bbTimer <= 0) {
          bbPos++;
          bb.pos = Math.min(bb.path.length - 1, bbPos);
          if (bbPos >= 2) {
            bbState = 'atVent'; bbTimer = 3.2;
            power = Math.max(0, power - (2 + Math.random()));  // 随机偷 2~3%
            sfxSteal(); sfxCoin();
          } else { bbTimer = 3.6; sfxVent(); }
        }
      } else if (bbState === 'atVent') {
        bbTimer -= dt;
        if (bbTimer <= 0) bbState = 'leave';
      } else if (bbState === 'leave') {
        bbState = 'idle'; musicBox = 100; bb.pos = 0;
      }
    }

    /* ---- 管栖貂：盯监控或开同侧灯逼退，到风口不挡就跳杀 ---- */
    if (crawler.enabled) {
      var watchedVent = camOpen && curCam === crawler.cam;
      var litVent = crawler.side === 'L' ? lightL : lightR;
      if (!crawler.atVent) {
        if (watchedVent || litVent) crawler.progress = Math.max(0, crawler.progress - (watchedVent ? 22 : 14) * dt);
        else crawler.progress = Math.min(100, crawler.progress + (decay ? 4.2 : 3.2) * dt);
        if (crawler.progress >= 100) {
          crawler.atVent = true; crawler.timer = doorWindow(); sfxVentPop();
        }
      } else {
        if (watchedVent || litVent) {
          crawler.progress = Math.max(0, crawler.progress - 34 * dt);
          if (crawler.progress < 38) { crawler.atVent = false; sfxKnock(); }
        } else {
          crawler.timer -= dt;
          if (crawler.timer <= 0) { startScare('marten'); return; }
        }
      }
    }

    /* ---- 赤尾狐：盯着 F3 绒绒窝，不看就跑出来 ---- */
    var fx = animById('ember');
    if (fx && fx.enabled) {
      if (foxyState === 'lair') {
        if (camOpen && curCam === PEN_CAM) foxyProgress = Math.max(0, foxyProgress - 14 * dt);
        else foxyProgress = Math.min(100, foxyProgress + 1.5 * dt);
        if (foxyProgress >= 100) {
          foxyState = 'sprint'; foxyTimer = 3.6; foxyDoorSide = 'L'; sfxSprint();
        }
      } else if (foxyState === 'sprint') {
        foxyTimer -= dt;
        if (foxyTimer <= 0) {
          foxyState = 'door'; foxyTimer = doorWindow();
          foxyPenalty = 0; foxyCharged = false;
          fx.atDoor = true; fx.pos = fx.path.length - 1;
        }
      } else if (foxyState === 'door') {
        if (doorL) {
          if (!foxyCharged) {
            foxyPenalty = 3 + Math.random() * 2;
            foxyCharged = true; sfxThud();
          }
          foxyTimer -= dt;
          if (foxyTimer <= 0) {
            foxyState = 'leave'; foxyProgress = 0; foxyTimer = 2.0;
            fx.atDoor = false; fx.pos = 0;
          }
        } else {
          foxyTimer -= dt;
          if (foxyTimer <= 0) { startScare('ember'); return; }
        }
      } else if (foxyState === 'leave') {
        foxyTimer -= dt;
        if (foxyTimer <= 0) { foxyState = 'lair'; foxyProgress = 0; }
      }
    }

    /* ---- 常规兽兽：未启用的只在监控里移动，不进攻 ---- */
    for (var i = 0; i < anims.length; i++) {
      var a = anims[i];
      if (a.special) continue;
      a.moveIn -= dt;
      if (a.moveIn <= 0) {
        a.moveIn = moveInterval() * (0.85 + Math.random() * 0.3);
        if (Math.random() * 20 < aiLevel(a)) {
          a.pos++;
          if (a.pos >= a.path.length - 1) {
            if (a.enabled) {
              a.pos = a.path.length - 1; a.atDoor = true;
              a.doorTimer = doorWindow(); a.blockTimer = 0;
              if (a.route === 'vent') sfxVent(); else sfxThud();
            } else {
              a.pos = 0;   // 只移动：转一圈回起点
            }
          } else {
            if (a.route === 'vent') sfxVent(); else sfxStep();
          }
        }
      }
      if (a.atDoor) {
        var side = a.side;
        var closed = side === 'L' ? doorL : doorR;
        var lit = side === 'L' ? lightL : lightR;
        /* 风口没有门：风管怪只能靠开灯逼退 */
        var blocked = a.route === 'vent' ? lit : closed;
        if (blocked) {
          a.blockTimer += dt;
          if (a.blockTimer >= 2.6) {
            a.pos = Math.max(0, a.path.length - 2);
            a.atDoor = false; a.blockTimer = 0; a.moveIn = moveInterval();
            sfxKnock();
          }
        } else {
          a.blockTimer = 0; a.doorTimer -= dt;
          if (a.doorTimer <= 0) {
            startScare(a.id);
            if (a.route === 'vent') scare.__vent = true;
            return;
          }
        }
      }
    }
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    frameNow = now;
    var dt = (last === null) ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now; fanAngle += dt * 9;

    /* 动画推进（与游戏状态无关） */
    if (introAnim > 0) introAnim = Math.max(0, introAnim - dt);
    if (camAnim < 1) camAnim = Math.min(1, camAnim + dt / 0.40);
    var dl = doorL ? 1 : 0, dr = doorR ? 1 : 0;
    doorAnimL += (dl - doorAnimL) * Math.min(1, dt * 9);
    doorAnimR += (dr - doorAnimR) * Math.min(1, dt * 9);
    ['lightL', 'lightR', 'doorL', 'doorR'].forEach(function (k) {
      if (swAnim[k] > 0) swAnim[k] = Math.max(0, swAnim[k] - dt * 3.2);
    });

    if (state === 'boot') { bootTick(dt); return; }
    if (state === 'warning') return;
    if (state === 'playing') {
      update(dt);
      hudTick += dt;
      if (hudTick >= 0.1) { hudTick = 0; renderHUD(); }
    } else if (state === 'jumpscare') {
      scare.t = Math.max(0, (now - scare.startAt) / 1000);
      if (!scare.sfxDone && scare.t >= SCARE_PRE_SEC) {
        scare.sfxDone = true; scare.sfxAt = scare.t;
        scare.dur = scare.sfxAt + SCARE_MAIN_SEC;
        sfxScare();
      }
      if (scare.t >= scare.dur) {
        var id = scare.id;
        if (id === 'rust' && blackout) redReason = '电耗尽后，闸门全部失效，锈背熊走进了夜巡室。';
        else if (id === 'ember') redReason = '赤尾狐从窝里窜出来，撞开了没关的左闸门。';
        else if (id === 'marten' || scare.__vent) redReason = '风管里的兽兽从风口爬进了夜巡室。';
        else redReason = '有兽兽贴到了闸门口，而闸门还开着。';
        redT = 0; state = 'red';
        document.body.classList.remove('shake');   // 停抖，全屏层继续用来画红屏
      }
    } else if (state === 'red') {
      redT += dt;
      if (redT >= RED_SEC) { endScareFx(); lose(redReason); }
    } else if (state === 'daybreak') {
      dayAnim += dt;
      if (dayAnim >= 2.0) finishWin();
    }
    if (state === 'playing' || state === 'menu') {
      if (camOpen && !blackout) drawCamera(); else drawOffice();
    } else if (state === 'jumpscare') drawScare();
    else if (state === 'red') drawRed();
    else if (state === 'daybreak') drawDaybreak();
    if (state === 'playing') drawTutorial();
  }

  /* ---------- 初始界面 ---------- */
  loadAll(); bootStart(); drawOffice(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
