<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>午夜保安室</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
#back{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:99;min-width:44px;min-height:44px;padding:10px 14px;border:0;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;text-decoration:none}
/* ===== 机身 ===== */
body{
  color:#e7ddc9;
  background:
    radial-gradient(ellipse at 50% -10%, #3c372f 0%, #1a1a1e 55%, #08090c 100%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px);
  display:flex; align-items:center; justify-content:center;
}
#app{
  position:relative; width:min(100%,1100px); height:100%;
  display:flex; flex-direction:column; gap:10px; padding:52px 14px 12px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.07), transparent 11%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 4px),
    linear-gradient(180deg,#35322c,#222225 48%,#181a1d);
  border:2px solid #0b0c0f; border-radius:20px;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.11), inset 0 -4px 0 rgba(0,0,0,.6),
    0 0 0 3px #5c554a, 0 0 0 6px #141518, 0 18px 50px rgba(0,0,0,.85);
}
#app::before,#app::after{
  content:""; position:absolute; top:11px; width:10px; height:10px; border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #a89d89, #565044 60%, #201e1a);
  box-shadow:inset 0 0 0 1px #100f0d, 0 1px 2px #000;
}
#app::before{left:11px} #app::after{right:11px}
#brand{
  position:absolute; top:16px; left:0; right:0; text-align:center; pointer-events:none;
  font:700 11px/1 ui-monospace,monospace; letter-spacing:3px; color:#978c76;
  text-shadow:0 1px 0 #000;
}
#back{
  z-index:99999; border:1px solid #0b0c0f; border-radius:11px;
  background:linear-gradient(180deg,#4b5057,#292e34 55%,#1b1f24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.5), 0 3px 0 #0c0e11, 0 5px 10px #000a;
  font-weight:800; text-shadow:0 1px 1px #000; user-select:none;
}
#back:active{transform:translateY(2px); box-shadow:inset 0 2px 6px #000a}
noscript{position:fixed;top:60px;left:8px;z-index:99999;color:#ffcf6b;font-size:13px}

/* ===== 金属铭牌 HUD ===== */
#hud{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:8px 12px; font-size:13px; letter-spacing:.5px;
  background:linear-gradient(180deg,#403d37,#242529 55%,#191b1f);
  border:1px solid #0c0d10; border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 5px rgba(0,0,0,.7), 0 3px 8px #0009;
}
#hud .cell{display:flex;align-items:center;gap:7px;white-space:nowrap}
#hud .label{color:#a99e87;font-size:11px;font-weight:700;letter-spacing:1px}
#hud .big{
  font:800 18px/1.2 ui-monospace,monospace; color:#ffd07a; font-variant-numeric:tabular-nums;
  padding:3px 9px; border-radius:6px; border:1px solid #050607;
  background:#0a0d10;
  box-shadow:inset 0 2px 6px #000, 0 1px 0 rgba(255,255,255,.10);
  text-shadow:0 0 10px rgba(255,179,71,.55);
}
#powerWrap{
  position:relative; flex:1 1 auto; min-width:90px; height:16px; overflow:hidden;
  border-radius:9px; border:1px solid #090a0c;
  background:linear-gradient(180deg,#05070a,#14181d 45%,#05070a);
  box-shadow:inset 0 2px 5px #000, 0 1px 0 rgba(255,255,255,.10);
}
#powerWrap::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 9%, rgba(0,0,0,.5) 9% calc(9% + 2px));
}
#powerBar{
  height:100%; width:100%;
  background:linear-gradient(180deg,#8ff0b0,#39c47a 55%,#1b8a52);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.3), 0 0 12px rgba(90,230,150,.5);
  transition:width .12s linear, background .3s;
}
#powerBar.mid{background:linear-gradient(180deg,#ffe08a,#f0a13c 55%,#b56f17)}
#powerBar.low{background:linear-gradient(180deg,#ff9b7a,#ef4d3d 55%,#9c2118)}
#powerBar.crit{animation:blink .35s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#btnPause{
  flex:0 0 auto; min-width:44px; min-height:44px; padding:6px 10px; cursor:pointer;
  border:1px solid #0b0c0f; border-radius:10px; color:#d8e0e6; font-size:15px; font-weight:800;
  background:linear-gradient(180deg,#4a4f55,#2c3137 55%,#1d2126);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26), inset 0 -2px 0 rgba(0,0,0,.5), 0 3px 0 #0c0e11, 0 5px 9px #0008;
  text-shadow:0 1px 1px #000; user-select:none;
}
#btnPause:active{transform:translateY(2px); box-shadow:inset 0 2px 6px #000a}

/* ===== 显像管屏幕 ===== */
#screen{
  position:relative; flex:1 1 auto; min-height:0; width:100%;
  background:#000; border:0; border-radius:26px / 20px; overflow:hidden;
  box-shadow:
    inset 0 0 0 3px #0a0c0f, inset 0 0 0 11px #23262b, inset 0 0 42px #000,
    0 0 0 3px #4d4840, 0 0 0 7px #131417, 0 8px 22px rgba(0,0,0,.75);
}
#stage{display:block;width:100%;height:100%;object-fit:contain;touch-action:manipulation}
#crt{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;overflow:hidden}
#crt i{position:absolute;display:block;inset:0}
#crt .scan{
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0px, rgba(0,0,0,.15) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.36) 100%);
  mix-blend-mode:multiply;
}
#crt .snow{
  inset:-25%;
  background:
    repeating-linear-gradient(62deg, rgba(255,255,255,.085) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-28deg, rgba(255,255,255,.06) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 7px);
  background-size:83px 79px, 107px 61px, 53px 47px;
  opacity:.22; animation:snowJ .18s steps(3) infinite;
}
#crt .roll{
  background:linear-gradient(180deg, transparent 0%, rgba(180,225,255,.03) 42%, rgba(205,238,255,.10) 50%, rgba(180,225,255,.03) 58%, transparent 100%);
  background-size:100% 220%; opacity:.55; animation:roll 8s linear infinite;
}
#crt .glass{
  background:
    linear-gradient(112deg, transparent 34%, rgba(190,225,255,.055) 47%, transparent 58%),
    radial-gradient(ellipse at 50% 6%, rgba(255,255,255,.05), transparent 55%);
  box-shadow:inset 2px 0 0 rgba(255,60,60,.05), inset -2px 0 0 rgba(60,160,255,.06);
  animation:flick 3.1s steps(1) infinite;
}
@keyframes snowJ{
  0%{background-position:0 0,0 0,0 0}
  33%{background-position:19px -11px,-13px 9px,7px 5px}
  66%{background-position:-9px 13px,11px -7px,-5px 9px}
  100%{background-position:5px -5px,-17px 13px,9px -3px}
}
@keyframes roll{0%{background-position:0 -120%}100%{background-position:0 120%}}
@keyframes flick{0%,97%{opacity:1}98%{opacity:.86}99%{opacity:1}100%{opacity:.94}}

/* ===== 塑料按键 ===== */
#controls{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;gap:8px}
.btn{
  min-height:56px; padding:10px 4px; border-radius:11px; cursor:pointer;
  border:1px solid #0b0d10; color:#d3dae1;
  font-size:13px; font-weight:800; text-align:center; line-height:1.25;
  background:linear-gradient(180deg,#4d5258,#34393f 42%,#23272c);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.45),
    0 4px 0 #0c0e11, 0 6px 10px rgba(0,0,0,.7);
  text-shadow:0 1px 1px #000; user-select:none;
  transition:transform .07s, box-shadow .07s, background .15s, color .15s;
}
.btn small{display:block;font-size:10px;font-weight:600;color:#8e99a5;margin-top:3px;text-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 6px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.08), 0 1px 0 #0c0e11}
.btn.on{
  background:linear-gradient(180deg,#ffdf91,#e8ad3f 45%,#c5871f);
  color:#2a1a06; border-color:#6b4410; text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,70,10,.5), 0 4px 0 #4a2c08, 0 0 18px rgba(255,180,60,.45);
}
.btn.on small{color:#6d4715}
.btn.door.on{
  background:linear-gradient(180deg,#a6ecff,#47b4da 45%,#2179a3);
  color:#05202b; border-color:#1a5c7c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(10,60,90,.5), 0 4px 0 #103f55, 0 0 18px rgba(90,210,255,.45);
}
.btn.door.on small{color:#0d4459}
#btnCam.on{
  background:linear-gradient(180deg,#b6f5cf,#49c98a 45%,#238a5b);
  color:#062017; border-color:#1a6a44;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(10,70,45,.5), 0 4px 0 #124833, 0 0 18px rgba(80,240,160,.45);
}
#btnCam.on small{color:#0e4a33}

/* ===== 面板 ===== */
#overlay{
  position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(8,10,14,.68), rgba(2,3,6,.88)); padding:18px;
}
#overlay.hidden{display:none}
.panel{
  width:min(520px,100%); max-height:100%; overflow:auto; text-align:center; padding:22px 20px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), transparent 10%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px),
    linear-gradient(180deg,#35332e,#202225 60%,#15171a);
  border:2px solid #0b0c0f; border-radius:18px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.13), inset 0 -4px 0 rgba(0,0,0,.55),
              0 0 0 3px #5b554b, 0 0 0 5px #15161a, 0 20px 60px #000;
}
.panel h1{margin:0 0 6px;font-size:24px;color:#ffcf6b;letter-spacing:2px;text-shadow:0 2px 0 #000,0 0 18px rgba(255,174,61,.35)}
.panel h2{margin:0 0 12px;font-size:20px;letter-spacing:1px;color:#e7ddc9;text-shadow:0 1px 0 #000}
.panel p{margin:8px 0;font-size:13px;line-height:1.7;color:#c6bfae}
.panel .sub{color:#968c79;font-size:12px}
.panel ul{text-align:left;font-size:12.5px;line-height:1.85;color:#c6bfae;margin:12px 0;padding-left:20px}
.panel .start{
  margin-top:14px;width:100%;padding:13px;font-size:15px;font-weight:800;letter-spacing:2px;
  color:#1a1205;background:linear-gradient(180deg,#ffdc8a,#e0a33c);border:none;border-radius:9px;cursor:pointer;
}
.warn{color:#ff9a86 !important} .ok{color:#8be8ae !important}

/* ===== 菜单按键 / 夜选择 / 旋钮 ===== */
.menuBtn{
  display:block; width:100%; min-height:54px; margin-top:9px; padding:12px 14px;
  text-align:left; color:#dde4eb; cursor:pointer; user-select:none;
  border:1px solid #0b0d10; border-radius:11px;
  background:linear-gradient(180deg,#474c52,#2e3339 45%,#202429);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26), inset 0 -3px 0 rgba(0,0,0,.45), 0 4px 0 #0c0e11, 0 6px 10px #0008;
  font:800 14px/1.35 inherit; text-shadow:0 1px 1px #000;
}
.menuBtn small{display:block;font-weight:600;font-size:11px;color:#8d99a5;margin-top:4px;text-shadow:none}
.menuBtn:active{transform:translateY(3px);box-shadow:inset 0 2px 6px #000a}
.menuBtn.primary{
  background:linear-gradient(180deg,#ffdf91,#e8ad3f 45%,#c5871f);
  color:#2a1a06;border-color:#6b4410;text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,70,10,.5), 0 4px 0 #4a2c08, 0 0 18px rgba(255,180,60,.35);
}
.menuBtn.primary small{color:#6d4715}
.menuBtn.ghost{min-height:46px;padding:10px;text-align:center;font-size:12px;background:linear-gradient(180deg,#3a3e43,#202428);color:#a9b7c4}
.nightGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 8px}
.nightCard{
  min-height:56px;padding:10px 3px;border-radius:10px;cursor:pointer;user-select:none;
  border:1px solid #0b0d10;color:#c8d6e2;
  background:linear-gradient(180deg,#474c52,#2c3137 55%,#1e2227);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24), inset 0 -2px 0 rgba(0,0,0,.5), 0 3px 0 #0c0e11;
  font:800 18px/1 ui-monospace,monospace;
}
.nightCard small{display:block;font:600 9px/1.4 inherit;color:#7c8996;margin-top:6px}
.nightCard:active{transform:translateY(2px);box-shadow:inset 0 2px 6px #000a}
.nightCard.on{
  background:linear-gradient(180deg,#ffdf91,#e8ad3f 45%,#c5871f);
  color:#2a1a06;border-color:#6b4410;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 0 16px rgba(255,180,60,.45), 0 3px 0 #4a2c08;
}
.nightCard.on small{color:#6d4715}
.nightCard.lock{opacity:.38;cursor:not-allowed;border-style:dashed;box-shadow:inset 0 2px 8px #000}
.sliderRow{display:flex;align-items:center;gap:10px;margin:8px 0;min-height:44px;text-align:left}
.sliderRow label{flex:0 0 76px;font-size:12px;color:#cfc6b2;font-weight:800}
.sliderRow input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1 1 auto;height:36px;background:transparent;cursor:pointer;
}
.sliderRow input[type=range]::-webkit-slider-runnable-track{
  height:12px;border-radius:7px;border:1px solid #08090b;
  background:linear-gradient(180deg,#05070a,#20252b 45%,#05070a);
  box-shadow:inset 0 2px 5px #000,0 1px 0 rgba(255,255,255,.10);
}
.sliderRow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#ded7c7,#8c8577 55%,#48443c);
  border:2px solid #26241f;box-shadow:0 2px 4px #000b,inset 0 1px 0 rgba(255,255,255,.6);
}
.sliderRow input[type=range]::-moz-range-track{
  height:12px;border-radius:7px;border:1px solid #08090b;
  background:linear-gradient(180deg,#05070a,#20252b 45%,#05070a);
}
.sliderRow input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#ded7c7,#8c8577 55%,#48443c);
  border:2px solid #26241f;box-shadow:0 2px 4px #000b;
}
.sliderRow output{flex:0 0 36px;text-align:right;font:800 15px ui-monospace,monospace;color:#ffcf6b;text-shadow:0 0 10px rgba(255,179,71,.4)}
.preset{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:64px;
  margin:3px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer;user-select:none;
  color:#c6dbe9;border:1px solid #0b0d10;border-radius:22px;
  background:linear-gradient(180deg,#3d4a54,#212a32 55%,#172027);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.5),0 3px 0 #0c0e11;
}
.preset:active{transform:translateY(2px);box-shadow:inset 0 2px 6px #000a}

/* ===== 跳杀层 ===== */
#scareCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:9000;display:none;background:#000;pointer-events:none}
#scareCanvas.on{display:block}
body.scareOn #app{filter:brightness(.25) contrast(1.6)}
body.shake{animation:shk .055s infinite}
body.shake #app{animation:shk2 .07s infinite}
@keyframes shk{0%{transform:translate(4px,2px)}25%{transform:translate(-6px,-4px)}50%{transform:translate(3px,6px)}75%{transform:translate(-5px,-2px)}100%{transform:translate(5px,-4px)}}
@keyframes shk2{0%{transform:translate(-3px,1px) rotate(-.3deg)}50%{transform:translate(4px,-3px) rotate(.4deg)}100%{transform:translate(-2px,3px) rotate(-.2deg)}}

@media (max-width:520px){
  #app{padding:52px 8px 8px;gap:7px;border-radius:14px}
  #brand{display:none}
  #hud{padding:6px 8px;gap:6px;font-size:11px}
  #hud .big{font-size:15px;padding:2px 6px}
  #controls{gap:5px}
  .btn{min-height:52px;padding:8px 2px;font-size:12px}
  .panel{padding:16px 14px}
  .nightGrid{gap:5px}
  .nightCard{min-height:52px}
}
</style></head><body>

<div id="app">
  <div id="brand">SECURITY MONITOR · NIGHT WATCH</div>
  <div id="hud">
    <div class="cell"><span class="label">时间</span><span class="big" id="hudTime">12 AM</span></div>
    <div class="cell"><span class="label">夜</span><span class="big" id="hudNight">1</span></div>
    <div class="cell" style="flex:1 1 auto"><span class="label">电量</span><div id="powerWrap"><div id="powerBar"></div></div><span class="big" id="hudPower" style="font-size:14px;min-width:42px;text-align:right">100%</span></div>
    <button id="btnPause" title="暂停 / 继续">⏸</button>
  </div>

  <div id="screen">
    <canvas id="stage" width="960" height="540"></canvas>
    <div id="crt"><i class="scan"></i><i class="snow"></i><i class="roll"></i><i class="glass"></i></div>
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>

  <div id="controls">
    <div class="btn" id="btnLightL">左灯</div>
    <div class="btn door" id="btnDoorL">左门</div>
    <div class="btn" id="btnCam">监控</div>
    <div class="btn door" id="btnDoorR">右门</div>
    <div class="btn" id="btnLightR">右灯</div>
  </div>

</div>

<canvas id="scareCanvas"></canvas>



<script>
/* =========================================================================
   游戏主体 v3
   4 分钟一局 · 10 个摄像头（含管道）· 气球男孩发条偷电 · 霍斯窥视冲刺
   ========================================================================= */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('stage');
  var ctx = canvas.getContext('2d');
  var W = 960, H = 540;
  canvas.width = W; canvas.height = H;

  /* ---------- 配置 ---------- */
  var SEC_PER_HOUR = 40;             // 游戏内 1 小时 = 40 秒
  var NIGHT_SEC = SEC_PER_HOUR * 6;  // 12AM → 6AM，整局 240 秒（4 分钟）
  var HOUR_LABEL = ['12 AM', '1 AM', '2 AM', '3 AM', '4 AM', '5 AM', '6 AM'];
  var DOOR_REACT_MIN = 4.5, DOOR_REACT_RANGE = 2.5; // 贴门后 4.5~7 秒反应窗口
  /* 跳杀：画面时长 = 预惊 + 主音效时长，音效一结束画面同一帧收掉 */
  var SCARE_PRE_SEC = 0.13;
  var SCARE_MAIN_SEC = 1.8;
  var SCARE_SOUND_SEC = SCARE_PRE_SEC + SCARE_MAIN_SEC;
  var STORE_KEY = 'midnight_office_night';

  /* 最低倍率 0.60 下：双门常关 / 双灯常开 都会在 5 AM 前耗尽电量 */
  var NIGHTS = [
    { n: 1, ai: [3, 2, 1],    power: 0.62, name: '第一夜', desc: '教学夜 · 反应时间很充裕' },
    { n: 2, ai: [5, 4, 2],    power: 0.72, name: '第二夜', desc: '脚步声变频繁了' },
    { n: 3, ai: [8, 6, 5],    power: 0.82, name: '第三夜', desc: '三只同时出动' },
    { n: 4, ai: [11, 9, 8],   power: 0.92, name: '第四夜', desc: '电量开始吃紧' },
    { n: 5, ai: [15, 13, 11], power: 1.02, name: '第五夜', desc: '全员高压 · 极限' }
  ];
  var CUSTOM_POWER = 0.62;   // 自定义夜耗电固定，不再可调

  /* 10 个摄像头，顺序对应键盘 1~9 / 0 */
  var CAMS = [
    { id: '1A', name: '主舞台',   vent: false },
    { id: '1B', name: '餐厅',     vent: false },

  function drawSparkFlash() {
    var f = sparkFlash;

    var k = Math.min(1, f.t / f.dur);
    fillR(0, 0, W, H, '#03060a');

    // 越往后怼得越近：起步就几乎贴脸，结束时超出画面

    ctx.restore();
    ctx.save();
    ctx.globalAlpha = .22; ctx.translate(26, -4);
    drawSpark(W / 2, H / 2 + 30, scale, true);
    ctx.restore();
    fillR(0, 0, W, H, 'rgba(255,40,40,.075)');

    // 主体：带抖动
    var jx = (Math.random() - .5) * 34 * (1 - k * .35);
    var jy = (Math.random() - .5) * 24 * (1 - k * .35);
    drawSpark(W / 2 + jx, H / 2 + 30 + jy, scale, true);
    fillR(0, 0, W, H, 'rgba(70,210,255,.05)');

    // 撕裂横条

    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(.7, 'rgba(30,0,0,.30)');
    vg.addColorStop(1, 'rgba(0,0,0,.82)');

    if (k < .10) fillR(0, 0, W, H, 'rgba(238,248,255,' + (0.88 - k * 8) + ')');

      ctx.shadowBlur = 0;

    } else if (cam === '2A' || cam === '2B') {

  /* ---------- 可点击平面图（含管道路线） ---------- */
  function camName(id) {

  function drawMapBlock(r, id, isOffice) {
    var active = id === curCam, hover = id === hoverCam, isVent = !!VENT_CAMS[id];
    var bg, border, txt, glow = 0;
    if (isOffice) { bg = 'rgba(52,38,18,.62)'; border = '#7a633c'; txt = '#e6c483'; }
    else if (active) { bg = isVent ? 'rgba(13,84,80,.80)' : 'rgba(14,78,108,.80)'; border = isVent ? '#5ce0cf' : '#78e2ff'; txt = '#eafaff'; glow = 12; }

    else if (isVent) { bg = 'rgba(8,38,40,.55)'; border = '#2f7a76'; txt = '#78c6bf'; }
    else { bg = 'rgba(8,20,30,.52)'; border = 'rgba(74,120,150,.75)'; txt = '#9dc3da'; }
    ctx.save();
    if (glow) { ctx.shadowColor = border; ctx.shadowBlur = glow; }
    rrect(r.x, r.y, r.w, r.h, 4); ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = active ? 2 : 1.2; ctx.strokeStyle = border; ctx.stroke();

    fillR(r.x + 2, r.y + 1, r.w - 4, 1, active ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.18)');

  function drawMap() {

  /* ---------- 全屏跳杀 ---------- */
  var scareCanvas = $('scareCanvas');
  var sctx = scareCanvas.getContext('2d');
  var SW = 0, SH = 0;
  function sizeScare() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    SW = window.innerWidth; SH = window.innerHeight;
    scareCanvas.width = Math.max(1, Math.floor(SW * dpr));
    scareCanvas.height = Math.max(1, Math.floor(SH * dpr));

  }
  window.addEventListener('resize', sizeScare); sizeScare();
  function sFill(c) { sctx.fillStyle = c; sctx.fillRect(0, 0, SW, SH); }
  function sNoise(n, alpha) {
    sctx.save(); sctx.globalAlpha = alpha;
    for (var i = 0; i < n; i++) {
      sctx.fillStyle = Math.random() > .5 ? '#ffffff' : '#000000';
      sctx.fillRect(Math.random() * SW, Math.random() * SH, 2 + Math.random() * 5, 1 + Math.random() * 3);
    }
    sctx.restore();
  }
  function drawScare() {
    var st = scare.t;
    if (st < 0.13) { sFill('#000000'); sNoise(90, 0.10); return; }
    var p = Math.min(1, (st - 0.13) / (scare.dur - 0.13));
    var flash = st < 0.28 || (Math.floor(st * 34) % 5 === 0);
    sFill(flash ? '#ffffff' : (Math.floor(st * 30) % 2 ? '#4a0000' : '#0a0000'));
    var oldCtx = ctx; ctx = sctx;
    var sh = (Math.random() - .5) * 30 * (1 + p), sv = (Math.random() - .5) * 24 * (1 + p);
    var sc = 1.5 + Math.pow(p, 1.7) * (Math.min(SW, SH) / 95);
    sctx.save(); sctx.globalAlpha = 0.32; sctx.translate(SW / 2 - 16 + sh, SH / 2 + 30 + sv);
    drawAnim(scare.id, 0, 0, sc, true); sctx.restore();
    sctx.save(); sctx.globalAlpha = 0.26; sctx.translate(SW / 2 + 18 + sh, SH / 2 + 22 + sv);
    drawAnim(scare.id, 0, 0, sc, true); sctx.restore();
    sctx.save(); sctx.translate(SW / 2 + sh, SH / 2 + 26 + sv); sctx.rotate((Math.random() - .5) * 0.06);
    drawAnim(scare.id, 0, 0, sc, true); sctx.restore();
    ctx = oldCtx;
    for (var k = 0; k < 8; k++) {
      var yy = Math.random() * SH;
      sctx.fillStyle = Math.random() > .5 ? 'rgba(255,255,255,.18)' : 'rgba(255,20,20,.26)';
      sctx.fillRect((Math.random() - .5) * 90, yy, SW, 4 + Math.random() * 22);
    }
    sctx.save(); sctx.globalAlpha = 0.10;
    for (var sy = 0; sy < SH; sy += 4) {
      sctx.fillStyle = (Math.floor(sy / 4 + st * 40) % 2) ? '#ffffff' : '#000000';
      sctx.fillRect(0, sy, SW, 2);
    }
    sctx.restore();
    sNoise(Math.floor(700 + p * 900), 0.26);
    var vg = sctx.createRadialGradient(SW / 2, SH / 2, Math.min(SW, SH) * .18, SW / 2, SH / 2, Math.max(SW, SH) * .72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(140,0,0,.72)');

  }

  /* ---------- 地图点击 ---------- */
  function canvasPoint(e) {
    var r = canvas.getBoundingClientRect();
    var scale = Math.min(r.width / W, r.height / H) || 1;
    return { x: (e.clientX - r.left - (r.width - W * scale) / 2) / scale,
             y: (e.clientY - r.top - (r.height - H * scale) / 2) / scale };
  }
  function hitMap(p) {
    // 视觉块做小，触摸热区放大；窄屏时整块地图按最近镜头判定，手指不用对准
    var ids = Object.keys(MAP_RECTS);
    var narrow = window.innerWidth <= 520;
    if (narrow) {
      var m = MAP_PANEL;
      if (p.x < m.x || p.x > m.x + m.w || p.y < m.y || p.y > m.y + m.h) return '';
      var best = '', bestD = Infinity;
      for (var k = 0; k < ids.length; k++) {
        var rr = MAP_RECTS[ids[k]];
        var d = Math.abs(p.x - (rr.x + rr.w / 2)) + Math.abs(p.y - (rr.y + rr.h / 2)) * 1.7;
        if (d < bestD) { bestD = d; best = ids[k]; }
      }
      return best;
    }
    for (var i = 0; i < ids.length; i++) {
      var r = MAP_RECTS[ids[i]];
      if (p.x >= r.x - 22 && p.x <= r.x + r.w + 22 &&
          p.y >= r.y - 14 && p.y <= r.y + r.h + 14) return ids[i];
    }
    return '';
  }
  function hitWind(p) {
    var r = WIND_HIT;

  }
  function selectCam(id) {
    if (!id) return;

  /* ---------- 交互 ---------- */
  function toggle(which) {
    if (state !== 'playing' || blackout) return;
    if (which === 'lightL') { lightL = !lightL; sfxLight(); }
    if (which === 'lightR') { lightR = !lightR; sfxLight(); }
    if (which === 'doorL')  { doorL = !doorL;  sfxDoor(); }
    if (which === 'doorR')  { doorR = !doorR;  sfxDoor(); }
    if (which === 'cam')    { camOpen = !camOpen; sfxCam();
      if (!camOpen) { sparks.forEach(function (x) { x.watch = 0; }); sparkFlash = null; } }
    syncBtns();
  }

  $('btnLightR').addEventListener('click', function () { toggle('lightR'); });
  $('btnDoorL').addEventListener('click', function () { toggle('doorL'); });
  $('btnDoorR').addEventListener('click', function () { toggle('doorR'); });
  $('btnCam').addEventListener('click', function () { toggle('cam'); });

  document.addEventListener('keydown', function (e) {
    var k = String(e.key || '').toLowerCase();
    if (k === 'p' && (state === 'playing' || state === 'paused')) {
      if (state === 'playing') pauseGame(); else resumeGame();
      return;
    }
    if (state !== 'playing' || blackout) return;
    if (k === 'a') toggle('lightL');
    else if (k === 's') toggle('doorL');
    else if (k === 'd') toggle('doorR');
    else if (k === 'f') toggle('lightR');
    else if (k === ' ' || k === 'spacebar') { e.preventDefault(); toggle('cam'); }
    else if (k >= '1' && k <= '9') selectCam(CAMS[parseInt(k, 10) - 1].id);
    else if (k === '0') selectCam(CAMS[9].id);
  });

      '<div class="nightGrid">' + nightCards() + '</div>' +
      '<p class="sub" id="nightDesc">' + c.name + ' · ' + c.desc + ' · 耗电 ×' + c.power.toFixed(2) + '</p>' +
      '<button class="menuBtn primary" data-act="playNight">开始值班</button>' +
      '<button class="menuBtn ghost" data-act="main">← 返回主菜单</button>'
    );
  }
  function sliderHTML(label, i, val) {
    return '<div class="sliderRow"><label>' + label + '</label>' +
      '<input type="range" min="0" max="20" step="1" value="' + val + '" data-ai="' + i + '">' +
      '<output id="outA' + i + '">' + val + '</output></div>';
  }
  function showCustom() {
    showPanel(
      '<h2>自定义夜</h2>' +
      '<p class="sub">AI 0 = 不动，20 = 满级 · 一局 4 分钟 · 耗电固定</p>' +
      sliderHTML('里比特', 0, customAI[0]) + sliderHTML('克拉克', 1, customAI[1]) + sliderHTML('布拉姆', 2, customAI[2]) +
      '<div style="margin:12px 0">' +
      '<span class="preset" data-act="preset" data-p="2,2,2">轻松</span>' +
      '<span class="preset" data-act="preset" data-p="6,6,6">标准</span>' +
      '<span class="preset" data-act="preset" data-p="20,20,20">4/20 地狱</span>' +
      '</div>' +
      '<button class="menuBtn primary" data-act="playCustom">开始自定义夜</button>' +
      '<button class="menuBtn ghost" data-act="main">← 返回主菜单</button>'
    );
  }
  function showHelp() {
    showPanel(
      '<h2>操作</h2><ul>' +
      '<li>按<b>监控</b>打开画面；<b>点平面图上的小镜头钮</b>切换，或按 <b>1~9 / 0</b>。</li>' +
      '<li>在 <b>PC 奖品角</b>，<b>按住音乐盒上的旋钮</b>上发条；松手发条就会慢慢走完。</li>' +
      '<li>左右<b>门 / 灯</b>按钮直接点；<b>A S 空格 D F</b> 对应键盘，<b>P</b> 暂停。</li>' +
      '<li>电量归零门会全部失效；撑到 6 AM 就赢。</li>' +
      '</ul><button class="menuBtn ghost" data-act="main">← 返回主菜单</button>'
    );
  }
  $('panel').addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    sfxClick();
    if (act === 'main') showMain();
    else if (act === 'nights') showNights();
    else if (act === 'custom') showCustom();
    else if (act === 'help') showHelp();
    else if (act === 'pickNight') {
      var n = parseInt(el.getAttribute('data-n'), 10);
      if (n > unlocked) return;
      selNight = n;
      Array.prototype.forEach.call(document.querySelectorAll('.nightCard'), function (c) {
        var cn = parseInt(c.getAttribute('data-n'), 10);
        c.className = 'nightCard' + (cn === n ? ' on' : '') + (cn > unlocked ? ' lock' : '');
      });
      var c2 = NIGHTS[n - 1];
      $('nightDesc').textContent = c2.name + ' · ' + c2.desc + ' · 耗电 ×' + c2.power.toFixed(2);
    }
    else if (act === 'preset') {
      var v = el.getAttribute('data-p').split(',');
      for (var i = 0; i < 3; i++) {
        customAI[i] = parseInt(v[i], 10);
        var inp = document.querySelector('[data-ai="' + i + '"]'); if (inp) inp.value = customAI[i];
        if ($('outA' + i)) $('outA' + i).textContent = customAI[i];
      }
    }
    else if (act === 'playNight') startGame('normal', NIGHTS[selNight - 1]);
    else if (act === 'playCustom') startGame('custom', {
      n: 0, ai: customAI.slice(), power: CUSTOM_POWER, name: '自定义夜',
      desc: 'AI ' + customAI.join('/')
    });
    else if (act === 'retry') startGame(mode, nightCfg);
    else if (act === 'next') { selNight = Math.min(5, nightCfg.n + 1); startGame('normal', NIGHTS[selNight - 1]); }
    else if (act === 'resume') resumeGame();
    else if (act === 'quit') showMain();
  });
  $('panel').addEventListener('input', function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute('data-ai')) {
      var i = parseInt(el.getAttribute('data-ai'), 10);
      customAI[i] = parseInt(el.value, 10);
      if ($('outA' + i)) $('outA' + i).textContent = customAI[i];
    }
  });

  /* ---------- 开局 / 暂停 / 胜负 ---------- */
  function startGame(m, cfg) {
    audio(); startHum();
    mode = m; nightCfg = cfg; nightName = cfg.name || ('第' + cfg.n + '夜');
    state = 'playing';
    t = 0; power = 100; hourIdx = 0;
    camOpen = false; curCam = '1A'; hoverCam = '';
    doorL = doorR = lightL = lightR = false;
    blackout = false; blackoutTimer = 0; scare = null;
    lowWarned = false; critWarned = false;
    musicBox = 100; bbState = 'idle'; bbTimer = 0; bbPos = 0; bbStealTick = 0;
    winding = false; windTick = 0;
    foxyProgress = 0; foxyState = 'lair'; foxyTimer = 0; foxyPenalty = 0; foxyDoorSide = 'L'; foxyCharged = false;
    sparks = []; sparkFlash = null; sparkNext = 12 + Math.random() * 10;
    anims = makeAnims();
    last = performance.now(); hudTick = 0;
    scareCanvas.className = '';
    document.body.classList.remove('shake', 'scareOn');
    hidePanel(); syncBtns(); renderHUD();
  }
  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused'; winding = false;
    sparks.forEach(function (x) { x.watch = 0; });
    showPanel('<h2>⏸ 已暂停</h2>' +
      '<p class="sub">' + nightName + ' · ' + HOUR_LABEL[Math.min(6, hourIdx)] +
      ' · 电量 ' + Math.max(0, Math.round(power)) + '%</p>' +
      '<button class="menuBtn primary" data-act="resume">▶ 继续值班</button>' +
      '<button class="menuBtn ghost" data-act="quit">退出到主菜单</button>');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing'; last = performance.now(); hidePanel();
  }
  $('btnPause').addEventListener('click', function () {
    if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
  });
  function startScare(id) {
    if (state !== 'playing') return;
    sparkFlash = null;
    state = 'jumpscare';
    // 画面与音效共用同一时钟：startAt 是本帧时间戳，dur 是音效总结束时刻
    scare = { id: id, t: 0, dur: SCARE_SOUND_SEC, startAt: frameNow, sfxDone: false, sfxAt: 0 };
    camOpen = false; syncBtns(); sizeScare();
    scareCanvas.className = 'on';
    document.body.classList.add('shake', 'scareOn');
    sfxPreScare();
  }
  function endScareFx() {
    scareCanvas.className = '';
    document.body.classList.remove('shake', 'scareOn');
  }
  function lose(reason) {
    endScareFx(); state = 'lose'; winding = false; sparkFlash = null;
    var powerFail = /电耗尽/.test(reason);
    var foxyFail = /霍斯/.test(reason);
    var bbFail = bbState === 'stealing' || (powerFail && musicBox < 15);
    var tip;
    if (bbFail) {
      tip = '<p class="ok">发条要靠自己上：切到 <b>PC 奖品角</b>，<b>按住音乐盒上的旋钮</b>直到男孩退回礼物堆后面。'
          + '他一旦钻进管道就会来偷电，关左门能赶走。顺带留意别让门和灯一直开着。</p>';
    } else if (foxyFail) {
      tip = '<p class="ok">霍斯是<b>百米冠军</b>：常回 <b>1C 海盗湾</b> 盯一眼，帘子拉开到露出全身时他就快冲了。'
          + '冲刺后关上左门挡一会儿（会扣 3~5% 电），不挡就直接被跳杀。</p>';
    } else if (powerFail) {
      tip = '<p class="ok">省电铁律：<b>两扇门一直关、两个灯一直开，5 AM 必没电</b>。'
          + '用完就松手，看监控最便宜；电量归零门就全失效了。</p>';
    } else {
      tip = '<p class="ok">贴门后有 <b>4.5~7 秒</b>反应：按门口灯从观察窗确认，关门约 2.6 秒逼退，然后记得开门。'
          + '管道来的只能切 <b>5A / 5B</b> 看，防御同样只能关门。</p>';
    }
    showPanel('<h2 class="warn">☠ 你没能撑到天亮</h2><p>' + reason + '</p>' +
      '<p class="sub">' + nightName + ' · 存活 ' + Math.floor(t) + ' 秒 · 到达 ' + HOUR_LABEL[Math.min(6, hourIdx)] +
      ' · 剩余电量 ' + Math.max(0, Math.round(power)) + '%</p>' + tip +
      '<button class="menuBtn primary" data-act="retry">再来一局</button>' +
      '<button class="menuBtn ghost" data-act="main">← 主菜单</button>');
  }
  function win() {
    endScareFx(); state = 'win'; hourIdx = 6; sparkFlash = null; renderHUD(); sfxWin();
    var isNormal = mode === 'normal' && nightCfg.n >= 1 && nightCfg.n <= 5;
    var nextBtn = (isNormal && nightCfg.n < 5)
      ? '<button class="menuBtn primary" data-act="next">▶ 进入' + NIGHTS[nightCfg.n].name + '</button>' : '';
    var msg = (isNormal && nightCfg.n === 5) ? '<p class="ok">🏆 五夜全通关，你已经是老保安了。</p>' :
              '<p>天亮了，机械玩偶退回了舞台。</p>';
    if (isNormal) saveUnlock(Math.min(5, nightCfg.n + 1));
    showPanel('<h2 class="ok">⏰ 6:00 AM</h2><h1>你活过了' + nightName + '</h1>' + msg +
      '<p class="sub">用时 ' + Math.floor(t) + ' 秒 · 剩余电量 ' + Math.max(0, Math.round(power)) +
      '% · 撑过 6 个小时</p>' + nextBtn +
      '<button class="menuBtn' + (nextBtn ? '' : ' primary') + '" data-act="retry">再来一局</button>' +
      '<button class="menuBtn ghost" data-act="main">← 主菜单</button>');
  }

  /* ---------- 逻辑更新 ---------- */
  function moveInterval() { return Math.max(3.6, 6.0 - Math.min(5, hourIdx) * 0.42); }
  function aiLevel(a) { return Math.min(20, a.ai * (0.6 + 0.4 * (Math.min(5, hourIdx) / 5))); }

  function update(dt) {
    if (state !== 'playing') return;
    t += dt;
    hourIdx = Math.min(6, Math.floor(t / SEC_PER_HOUR));
    if (t >= NIGHT_SEC - 0.1) { if (blackout) startScare('bramble'); else win(); return; }

    /* 耗电：base 0.10 / 单门 0.44 / 单灯 0.44 / 监控 0.16
       最低倍率 0.60 × 双门常关(0.98) × 200s(5AM) = 117.6% → 5 AM 前必断电 */
    var drain = 0.10;
    if (camOpen) drain += 0.16;
    if (doorL) drain += 0.44;
    if (doorR) drain += 0.44;
    if (lightL) drain += 0.44;
    if (lightR) drain += 0.44;
    if (bbState === 'stealing') drain += 1.20;   // 气球男孩偷电（明显掉电）
    power -= drain * dt * nightCfg.power;
    if (foxyPenalty > 0) {                       // 霍斯撞门：一次性扣 3~5%
      power = Math.max(0, power - foxyPenalty);
      foxyPenalty = 0;
    }
    if (power < 50 && !lowWarned) { lowWarned = true; sfxLowPower(); }
    if (power < 20 && !critWarned) { critWarned = true; sfxLowPower(); }
    if (power <= 0 && !blackout) {
      power = 0; blackout = true;
      doorL = doorR = lightL = lightR = false; camOpen = false;
      sparkFlash = null; sparks.forEach(function (x) { x.watch = 0; });
      blackoutTimer = 3.5 + Math.random() * 2.5;
      syncBtns(); sfxBlackout();
    }
    if (blackout) {
      blackoutTimer -= dt;
      if (blackoutTimer <= 0) startScare('bramble');
      return;
    }

    /* ---- 随机电动玩偶：盯久了怼脸 0.7 秒，纯吓唬 ---- */
    if (sparkFlash) {
      sparkFlash.t += dt;
      if (sparkFlash.t >= sparkFlash.dur) sparkFlash = null;
    }
    // 到点随机刷 1~2 只，占用不同镜头
    sparkNext -= dt;
    if (sparkNext <= 0) {
      var alive = sparks.filter(function (x) { return !x.dead && !x.triggered; });
      if (alive.length < 2) {
        var pool = SPARK_CAMS.filter(function (id) {
          return !alive.some(function (x) { return x.cam === id; });
        });
        var count = Math.min(pool.length, Math.random() < .35 ? 2 : 1);
        for (var si = 0; si < count; si++) {
          var pick = Math.floor(Math.random() * pool.length);
          var camId = pool.splice(pick, 1)[0];
          sparks.push({
            cam: camId, life: 10 + Math.random() * 8,
            watch: 0, triggerAt: 2.2 + Math.random() * 1.6,
            variant: Math.floor(Math.random() * 3),
            seed: Math.random() * 1000, triggered: false, dead: false
          });
        }
      }
      sparkNext = 16 + Math.random() * 10;
    }
    // 注视累计：只算开着监控、连续盯同一个镜头
    var watching = camOpen && !blackout;
    for (var k = 0; k < sparks.length; k++) {
      var sp = sparks[k];
      if (sp.dead || sp.triggered) continue;
      sp.life -= dt;
      if (sp.life <= 0) { sp.dead = true; continue; }
      if (watching && sp.cam === curCam) {
        sp.watch += dt;
        if (sp.watch >= sp.triggerAt) {
          sp.triggered = true; sp.dead = true;
          sparkFlash = { t: 0, dur: SPARK_FLASH_SEC, variant: sp.variant };
          sfxSpark();
          sparkNext = Math.max(sparkNext, 8);   // 吓完给点缓冲
        }
      } else {
        sp.watch = 0;                          // 切走 / 关监控就重新算
      }
    }
    if (sparks.length > 24) sparks = sparks.filter(function (x) { return !x.dead; });

    /* ---- 发条音乐盒 ---- */
    if (bbState === 'idle') {
      if (winding && camOpen && curCam === MUSIC_CAM) {
        // 按住旋钮才上发条；松开就开始走
        musicBox = Math.min(100, musicBox + 24 * dt);
        windTick += dt;
        if (windTick > 0.4) { windTick = 0; sfxWind(); }
      } else {
        windTick = 0;
        musicBox -= 1.5 * dt;
      }
      if (musicBox <= 0) {
        musicBox = 0; bbState = 'moving'; bbPos = 0; bbTimer = 3.6;
        sfxVent();
        var bb = animById('balloon'); if (bb) { bb.atDoor = false; bb.pos = 0; }
      }
    } else if (bbState === 'moving') {
      bbTimer -= dt;
      if (bbTimer <= 0) {
        bbPos++;
        var bb2 = animById('balloon');
        if (bb2) bb2.pos = Math.min(bb2.path.length - 1, bbPos);
        if (bbPos >= 2) {
          bbState = 'stealing'; bbTimer = 14; bbStealTick = 0; bbBlockTimer = 0;
          sfxSteal();
        } else { bbTimer = 3.6; sfxVent(); }
      }
    } else if (bbState === 'stealing') {
      bbTimer -= dt; bbStealTick += dt;
      if (bbStealTick > 1.6) { bbStealTick = 0; sfxSteal(); }
      // 关左门累计 2.5 秒赶走
      if (doorL) {
        bbBlockTimer += dt;
        if (bbBlockTimer >= 2.5) { bbState = 'leave'; bbTimer = 0; }
      } else bbBlockTimer = 0;
      if (bbTimer <= 0) { bbState = 'leave'; bbTimer = 0; }
    } else if (bbState === 'leave') {
      bbState = 'idle'; musicBox = 100;
      var bb3 = animById('balloon'); if (bb3) { bb3.pos = 0; bb3.atDoor = false; }
    }

    /* ---- 霍斯：盯着 1C 压制，不看就冲刺 ---- */
    if (foxyState === 'lair') {
      if (camOpen && curCam === FOXY_CAM) foxyProgress = Math.max(0, foxyProgress - 14 * dt);
      else foxyProgress = Math.min(100, foxyProgress + 1.5 * dt);
      if (foxyProgress >= 100) {
        foxyState = 'sprint'; foxyTimer = 3.6; foxyDoorSide = 'L';
        sfxSprint();
      }
    } else if (foxyState === 'sprint') {
      foxyTimer -= dt;
      if (foxyTimer <= 0) {
        foxyState = 'door';
        foxyTimer = doorWindow();
        foxyPenalty = 0; foxyCharged = false;
        var fx = animById('foxy'); if (fx) { fx.atDoor = true; fx.pos = fx.path.length - 1; }
      }
    } else if (foxyState === 'door') {
      if (doorL) {
        // 被挡住：站门 4.5~7 秒，一次性扣 3~5% 电后离开
        if (!foxyCharged) {
          foxyPenalty = 3 + Math.random() * 2;
          foxyCharged = true; sfxThud();
        }
        foxyTimer -= dt;
        if (foxyTimer <= 0) {
          foxyState = 'leave'; foxyProgress = 0; foxyTimer = 2.0;
          var fx2 = animById('foxy'); if (fx2) { fx2.atDoor = false; fx2.pos = 0; }
        }
      } else {
        foxyTimer -= dt;
        if (foxyTimer <= 0) { startScare('foxy'); return; }
      }
    } else if (foxyState === 'leave') {
      foxyTimer -= dt;
      if (foxyTimer <= 0) { foxyState = 'lair'; foxyProgress = 0; }
    }

    /* ---- 常规三只玩偶 ---- */
    for (var i = 0; i < anims.length; i++) {
      var a = anims[i];
      if (a.special) continue;
      a.moveIn -= dt;
      if (a.moveIn <= 0) {
        a.moveIn = moveInterval() * (0.85 + Math.random() * 0.3);
        if (Math.random() * 20 < aiLevel(a) && !a.atDoor) {
          a.pos++;
          if (a.pos >= a.path.length - 1) {
            a.pos = a.path.length - 1; a.atDoor = true;
            a.doorTimer = doorWindow(); a.blockTimer = 0;
            if (a.route === 'vent') sfxVent(); else sfxThud();
          } else {
            if (a.route === 'vent') sfxVent(); else sfxStep();
          }
        }
      }
      if (a.atDoor) {
        var side = a.path[a.path.length - 1];
        var closed = side === 'L' ? doorL : doorR;
        if (closed) {
          a.blockTimer += dt;
          if (a.blockTimer >= 2.6) {
            a.pos = Math.max(0, a.path.length - 2);
            a.atDoor = false; a.blockTimer = 0; a.moveIn = moveInterval();
            sfxKnock();
          }
        } else {
          a.blockTimer = 0; a.doorTimer -= dt;
          if (a.doorTimer <= 0) { startScare(a.id); return; }
        }
      }
    }
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    frameNow = now;
    var dt = (last === null) ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now; fanAngle += dt * 9;
    if (state === 'playing') {
      update(dt);
      hudTick += dt;
      if (hudTick >= 0.1) { hudTick = 0; renderHUD(); }
    } else if (state === 'jumpscare') {
      // 用真实帧时钟推进，掉帧时画面仍与音效同时结束
      scare.t = Math.max(0, (now - scare.startAt) / 1000);
      if (!scare.sfxDone && scare.t >= SCARE_PRE_SEC) {
        scare.sfxDone = true; scare.sfxAt = scare.t;
        // 画面恰好在「这一声开始 + 音效长度」处收掉，掉帧也不会提前
        scare.dur = scare.sfxAt + SCARE_MAIN_SEC;
        sfxScare();
      }
      if (scare.t >= scare.dur) {
        var id = scare.id;
        if (id === 'bramble' && blackout) lose('电耗尽后，门锁全部失效，布拉姆走进了保安室。');
        else if (id === 'foxy') lose('霍斯百米冲刺撞开了没关的左门。');
        else lose('有玩偶贴到了门口，而门还开着。');
      }
    }
    if (state === 'playing' || state === 'menu') {
      if (camOpen && !blackout) drawCamera(); else drawOffice();
    } else if (state === 'jumpscare') drawScare();
  }

  /* ---------- 初始界面 ---------- */
  loadUnlock(); showMain(); drawOffice(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
